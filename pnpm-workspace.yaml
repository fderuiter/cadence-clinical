packages:
  - "apps/*"
  - "packages/*"

catalog:
  "@axe-core/playwright": "^4.14.0"
  "@playwright/test": "^1.65.1"
  "@types/node": "^26.6.6"
  "@typescript-eslint/eslint-plugin": "^8.73.0"
  "@typescript-eslint/parser": "^8.73.0"
  "@vitejs/plugin-vue": "^6.0.11"
  "@vitest/coverage-v8": "^5.1.1"
  axe-core: "^4.14.1"
  eslint-plugin-vue: "^10.12.1"
  fake-indexeddb: "^6.2.8"
  globals: "^17.14.0"
  jsdom: "^31.0.1"
  keycloak-js: "^26.2.5"
  lucide-vue-next: "^1.0.0"
  msw: "^3.0.7"
  pinia: "^4.1.0"
  typescript: "^7.0.2"
  typescript-eslint: "^8.73.0"
  vite: "^8.3.8"
  vitest: "^5.1.1"
  vue: "^3.5.46"
  vue-router: "^5.5.1"
  vue-tsc: "^3.3.14"

overrides:
  glob: ">=14.0.2"
  js-yaml: "^4.1.0"
  minimatch: ">=11.0.1"
  undici: ">=8.11.2"
  "vitepress>vite": "^6.4.6"

allowBuilds:
  esbuild: true
  msw: true

onlyBuiltDependencies:
