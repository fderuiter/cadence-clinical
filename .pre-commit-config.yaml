repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.22
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.7
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml", "-ll", "-ii"]
        additional_dependencies: ["bandit[toml]"]
        stages: [pre-commit, pre-push, manual]
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        exclude: "pnpm-lock.yaml|uv.lock|tests/fixtures/keys/"
        stages: [pre-commit, pre-push, manual]

  - repo: https://github.com/hadolint/hadolint
    rev: v2.12.0
    hooks:
      - id: hadolint-docker

  - repo: local
    hooks:
      - id: prettier-check
        name: Prettier Formatting & Syntax Check
        entry: pnpm exec prettier --check
        language: system
        files: \.(json|css|md)$
        pass_filenames: true

      - id: clean-secrets-baseline
        name: Clean Secrets Baseline
        entry: python3 scripts/clean_secrets_baseline.py
        language: system
        files: \.secrets\.baseline$
        pass_filenames: false

      - id: detect-code-duplication
        name: Detect Code Duplication
        entry: python3 scripts/detect_duplication.py
        language: system
        files: \.(py|js|vue|css)$
        pass_filenames: true

      - id: validate-adrs
        name: Validate ADRs
        entry: python3 scripts/validate_adrs.py
        language: system
        files: ^(docs/adr/|apps/gateway/|packages/security/|packages/ui/|apps/execution/database/|pyproject.toml$|package.json$|apps/execution/.*(models|migrations))
        pass_filenames: true

      - id: validate-architecture-drift
        name: Validate Architecture Drift
        entry: python3 scripts/validate_architecture_drift.py
        language: system
        files: ^(docker/docker-compose\.yml|ARCHITECTURE\.md|docs/SDLC/02_Technical_Design_Document_TDD\.md)$
        pass_filenames: false

      - id: validate-markdown
        name: Validate Custom Markdown
        entry: python3 scripts/validate_markdown.py
        language: system
        files: \.md$

      - id: validate-imports
        name: Cross-Service Import Validator
        entry: python3 scripts/validate_imports.py
        language: system
        files: ^(apps/|packages/|scripts/validate_imports\.py)
        pass_filenames: false

      - id: audit-security
        name: Security Audit & Hardcoded Secret Scanner
        entry: uv run python scripts/audit_security.py
        language: system
        files: \.(py|js|ts|tsx|jsx|json|md|log|txt|yaml|yml|sh|toml|ini|env|conf|properties)$
        pass_filenames: true
        stages: [pre-commit]

      - id: deid-compliance-scan
        name: DEID Compliance Scan
        entry: uv run python -m packages.deid.cli
        language: system
        files: \.(py|js|ts|tsx|jsx|json|md|log|txt)$
        pass_filenames: true

      - id: auto-stage-openapi
        name: Auto-Stage OpenAPI Schemas
        entry: python3 scripts/pre_commit_openapi.py
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: validate-path-patterns
        name: Lightweight Path-Pattern Boundary Linter
        entry: python3 scripts/validate_path_patterns.py
        language: system
        pass_filenames: true

      - id: backend-static-verify
        name: Backend Port Contract Static Verification
        entry: python3 scripts/verify_contracts.py
        language: system
        files: ^(apps/execution/domain/ports\.py|apps/execution/adapters/repositories\.py|apps/execution/infrastructure/repositories/execution_repositories\.py|apps/execution/application/ports\.py)$
        pass_filenames: false

      - id: query-style-linter
        name: Pre-Commit Query Style Linter
        entry: uv run python scripts/pre_commit_query_linter.py
        language: system
        files: \.py$
        exclude: ^(tests/|scripts/)
        pass_filenames: true

      - id: validate-vulnerabilities
        name: GxP Dependency Vulnerability Audit
        entry: uv run python scripts/validate_vulnerabilities.py
        language: system
        files: ^(pyproject\.toml|uv\.lock|pnpm-lock\.yaml|package\.json)$
        pass_filenames: false

      - id: prettier-check
        name: Prettier Formatting Check
        entry: pnpm exec prettier --check
        language: system
        files: \.(json|css|md)$
        pass_filenames: true

      # -----------------------------------------------------------------------
      # GxP RTM Staleness Check (pre-push only)
      # Validates that docs/SDLC/ is in sync with the committed test suite.
      # Run 'make sync-gxp' or 'pnpm sync-gxp' to regenerate if this fails.
      # Skip for a single push with: SKIP=gxp-rtm-validate git push
      # -----------------------------------------------------------------------
      - id: gxp-rtm-validate
        name: GxP RTM Staleness Check
        entry: uv run python scripts/generate_rtm.py --validate
        language: system
        pass_filenames: false
        stages: [pre-push]
