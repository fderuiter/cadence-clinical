repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.22
    hooks:
      - id: ruff
        args: [ --fix ]
      - id: ruff-format
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.7
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml", "-ll", "-ii"]
        additional_dependencies: ["bandit[toml]"]
        stages: [pre-commit, pre-push, manual]
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: 'pnpm-lock.yaml|uv.lock'
        stages: [pre-commit, pre-push, manual]

  - repo: local
    hooks:
      - id: clean-secrets-baseline
        name: Clean Secrets Baseline
        entry: python3 scripts/clean_secrets_baseline.py
        language: system
        files: \.secrets\.baseline$
        pass_filenames: false

      - id: check-markdown-links
        name: Check Markdown Links
        entry: python3 scripts/validate_markdown.py
        language: system
        files: \.md$
        pass_filenames: false

      - id: detect-code-duplication
        name: Detect Code Duplication
        entry: python3 scripts/detect_duplication.py
        language: system
        files: \.(py|js|vue|css)$
        pass_filenames: true

      - id: validate-adrs
        name: Validate ADRs
        entry: python3 scripts/validate_adrs.py
        language: system
        files: ^(docs/adr/|apps/gateway/|packages/security/|packages/ui/|apps/execution/database/|pyproject.toml$|package.json$|apps/execution/.*(models|migrations))
        pass_filenames: true

      - id: validate-markdown
        name: Validate Custom Markdown
        entry: python3 scripts/validate_markdown.py
        language: system
        files: \.md$

      - id: deid-compliance-scan
        name: DEID Compliance Scan
        entry: uv run python -m packages.deid.cli
        language: system
        files: \.(py|js|ts|tsx|jsx|json|md|log|txt)$
        pass_filenames: true

      # -----------------------------------------------------------------------
      # GxP RTM Staleness Check (pre-push only)
      # Validates that docs/SDLC/ is in sync with the committed test suite.
      # Run 'make sync-gxp' or 'pnpm sync-gxp' to regenerate if this fails.
      # Skip for a single push with: SKIP=gxp-rtm-validate git push
      # -----------------------------------------------------------------------
      - id: gxp-rtm-validate
        name: GxP RTM Staleness Check
        entry: uv run python scripts/generate_rtm.py --validate
        language: system
        pass_filenames: false
        stages: [pre-push]
