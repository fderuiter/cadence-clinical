repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml

  # Secret scanning against the committed baseline (issue #4765). New findings fail the commit; mark a
  # reviewed false positive with an inline `pragma: allowlist secret` comment.
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        exclude: (pnpm-lock\.yaml|uv\.lock|docs/CDISC/|docs/NCI/)

  - repo: https://github.com/hadolint/hadolint
    rev: v2.12.0
    hooks:
      - id: hadolint-docker

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.7
    hooks:
      - id: actionlint

  - repo: local
    hooks:
      - id: workflow-security
        name: Native Workflow Security & Action Pinning Sentinel
        entry: node scripts/run-cli.js check workflow-security
        language: system
        files: ^\.github/(workflows/[^/]+|actions/.+/action)\.(yml|yaml)$
        pass_filenames: false

      - id: prettier-check
        name: Prettier Formatting & Syntax Check
        entry: pnpm exec prettier --check
        language: system
        files: \.(js|jsx|ts|tsx|vue|json|css|md|yaml|yml)$
        pass_filenames: true

      - id: dotnet-format
        name: .NET C# Code Formatting Check (.editorconfig)
        entry: dotnet format Cadence.sln --verify-no-changes --include
        language: system
        files: \.cs$
        pass_filenames: true

      - id: validate-markdown
        name: Native Markdown Link & Path Sentinel
        entry: node scripts/run-cli.js check validate-markdown
        language: system
        files: \.md$
        pass_filenames: true

      - id: cadence-check
        name: Cadence Quality Sentinels & Policy Gates
        entry: node scripts/run-cli.js check --pre-commit
        language: system
        pass_filenames: false
