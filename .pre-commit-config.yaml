repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml


  # Secret scanning against the committed baseline (issue #4765). New findings fail the commit; mark a
  # reviewed false positive with an inline `pragma: allowlist secret` comment.
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        exclude: (pnpm-lock\.yaml|uv\.lock|docs/CDISC/|docs/NCI/)

  - repo: https://github.com/hadolint/hadolint
    rev: v2.12.0
    hooks:
      - id: hadolint-docker

  - repo: local
    hooks:
      - id: prettier-check
        name: Prettier Formatting & Syntax Check
        entry: pnpm exec prettier --check
        language: system
        files: \.(json|css|md)$
        pass_filenames: true

      - id: dotnet-format
        name: .NET C# Code Formatting Check (.editorconfig)
        entry: dotnet format Cadence.sln --verify-no-changes
        language: system
        files: \.(cs|csproj|sln)$
        pass_filenames: false

      - id: cadence-check
        name: Cadence Quality Sentinels & Policy Gates
        entry: dotnet run --project packages/cli/src/Cadence.Cli.csproj -- check
        language: system
        pass_filenames: false
