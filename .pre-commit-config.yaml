repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.7
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml", "-ll", "-ii"]
        additional_dependencies: ["bandit[toml]"]
        stages: [pre-commit, pre-push, manual]
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        exclude: >-
          (?x)(
            pnpm-lock\.yaml|uv\.lock|
            tests/fixtures/keys/|docs/CDISC/|docs/NCI/|docs/openapi/|docs/schema/|docs/SDLC/runs/|
            docs/migration/slices/.*/fixtures/|
            report.*\.xml|coverage.*\.xml|\.cadence/|dist/|
            \.(pdf|xlsx|xls|docx|doc|png|jpg|jpeg|gif|svg|ico|woff|woff2|eot|ttf|otf|mp4|webm|mp3|wav|zip|tar\.gz|gz|sqlite|db)$
          )
        stages: [pre-commit, pre-push, manual]

  - repo: https://github.com/hadolint/hadolint
    rev: v2.12.0
    hooks:
      - id: hadolint-docker

  - repo: local
    hooks:
      - id: prettier-check
        name: Prettier Formatting & Syntax Check
        entry: pnpm exec prettier --check
        language: system
        files: \.(json|css|md)$
        pass_filenames: true

      - id: dotnet-format
        name: .NET C# Code Formatting Check (.editorconfig)
        entry: dotnet run --project packages/cli/src/Cadence.Cli.csproj -- check dotnet-format
        language: system
        files: \.(cs|csproj|sln)$
        pass_filenames: false

      - id: dotnet-format-style
        name: .NET Roslyn Code Style & Analyzer Gate
        entry: dotnet run --project packages/cli/src/Cadence.Cli.csproj -- check dotnet-format-style
        language: system
        files: \.(cs|csproj|sln)$
        pass_filenames: false

      - id: clean-secrets-baseline
        name: Clean Secrets Baseline
        entry: dotnet run --project packages/cli/src/Cadence.Cli.csproj -- check clean-secrets-baseline
        language: system
        files: \.secrets\.baseline$
        pass_filenames: false

      - id: detect-code-duplication
        name: Detect Code Duplication
        entry: dotnet run --project packages/cli/src/Cadence.Cli.csproj -- check detect-code-duplication
        language: system
        files: \.(py|js|vue|css|cs)$
        pass_filenames: true

      - id: validate-cli-docs
        name: Validate CLI Docs Parity
        entry: dotnet run --project packages/cli/src/Cadence.Cli.csproj -- check validate-cli-docs
        language: system
        files: ^(packages/cli/|docs/cli\.md)
        pass_filenames: false

      - id: validate-adrs
        name: Validate ADRs
        entry: dotnet run --project packages/cli/src/Cadence.Cli.csproj -- check validate-adrs
        language: system
        files: ^(docs/adr/|apps/gateway/|packages/security/|packages/ui/|apps/execution/database/|pyproject.toml$|package.json$|apps/execution/.*(models|migrations))
        pass_filenames: true

      - id: validate-architecture-drift
        name: Validate Architecture Drift
        entry: dotnet run --project packages/cli/src/Cadence.Cli.csproj -- check validate-architecture-drift
        language: system
        files: ^(docker/docker-compose\.yml|ARCHITECTURE\.md|docs/SDLC/02_Technical_Design_Document_TDD\.md)$
        pass_filenames: false

      - id: path-requirement-sanitizer
        name: Path Sanitizer and Requirement Prefix Normalizer
        entry: dotnet run --project packages/cli/src/Cadence.Cli.csproj -- check path-requirement-sanitizer
        language: system
        files: \.md$
        exclude: ^docs/SDLC/runs/
        pass_filenames: true

      - id: validate-markdown
        name: Validate Custom Markdown
        entry: dotnet run --project packages/cli/src/Cadence.Cli.csproj -- check validate-markdown
        language: system
        files: \.md$

      - id: validate-environment-variables
        name: Validate Environment Variables
        entry: dotnet run --project packages/cli/src/Cadence.Cli.csproj -- check validate-environment-variables
        language: system
        files: ^(apps/|packages/|scripts/|\.env\.example$|docs/ENVIRONMENT_VARIABLES\.md$)
        pass_filenames: false

      - id: validate-readmes
        name: Validate README Documentation Coverage & Headers
        entry: dotnet run --project packages/cli/src/Cadence.Cli.csproj -- check validate-readmes
        language: system
        files: ^(packages/|apps/|scripts/)
        pass_filenames: false

      - id: validate-imports
        name: Cross-Service Import Validator
        entry: dotnet run --project packages/cli/src/Cadence.Cli.csproj -- check validate-imports
        language: system
        files: ^(apps/|packages/)
        pass_filenames: false

      - id: audit-security
        name: Security Audit & Hardcoded Secret Scanner
        entry: dotnet run --project packages/cli/src/Cadence.Cli.csproj -- check audit-security
        language: system
        files: \.(py|js|ts|tsx|jsx|json|md|log|txt|yaml|yml|sh|toml|ini|env|conf|properties|cs)$
        pass_filenames: true
        stages: [pre-commit]

      - id: deid-compliance-scan
        name: DEID Compliance Scan
        entry: dotnet run --project packages/cli/src/Cadence.Cli.csproj -- check deid-compliance-scan
        language: system
        files: \.(py|js|ts|tsx|jsx|json|md|log|txt|cs)$
        pass_filenames: true

      - id: auto-stage-openapi
        name: Auto-Stage OpenAPI Schemas
        entry: dotnet run --project packages/cli/src/Cadence.Cli.csproj -- check auto-stage-openapi
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: validate-api-clients
        name: Validate OpenAPI Frontend Clients AST Contract
        entry: dotnet run --project packages/cli/src/Cadence.Cli.csproj -- check validate-api-clients
        language: system
        files: ^(apps/web/src/api/|docs/openapi/cdisc_openapi\.json$)
        pass_filenames: false
        stages: [pre-commit]

      - id: auto-stage-schema-doc
        name: Auto-Stage Schema Documentation
        entry: dotnet run --project packages/cli/src/Cadence.Cli.csproj -- check auto-stage-schema-doc
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: validate-path-patterns
        name: Lightweight Path-Pattern Boundary Linter
        entry: dotnet run --project packages/cli/src/Cadence.Cli.csproj -- check validate-path-patterns
        language: system
        pass_filenames: true

      - id: backend-static-verify
        name: Backend Port Contract Static Verification
        entry: dotnet run --project packages/cli/src/Cadence.Cli.csproj -- check backend-static-verify
        language: system
        files: ^(apps/execution/domain/ports\.py|apps/execution/adapters/repositories\.py|apps/execution/adapters/repositories/execution_repositories\.py|apps/execution/application/ports\.py)$
        pass_filenames: false

      - id: query-style-linter
        name: Pre-Commit Query Style Linter
        entry: dotnet run --project packages/cli/src/Cadence.Cli.csproj -- check query-style-linter
        language: system
        files: \.cs$
        pass_filenames: true

      - id: validate-vulnerabilities
        name: GxP Dependency Vulnerability Audit
        entry: dotnet run --project packages/cli/src/Cadence.Cli.csproj -- check validate-vulnerabilities
        language: system
        files: ^(pyproject\.toml|uv\.lock|pnpm-lock\.yaml|package\.json)$
        pass_filenames: false

      - id: validate-dependencies
        name: Frontend Dependency Cryptographic Check
        entry: dotnet run --project packages/cli/src/Cadence.Cli.csproj -- check validate-dependencies
        language: system
        files: package\.json$
        pass_filenames: false

      - id: gxp-rtm-validate
        name: GxP RTM Staleness Check
        entry: dotnet run --project packages/cli/src/Cadence.Cli.csproj -- check gxp-rtm-validate
        language: system
        pass_filenames: false
        stages: [pre-push]
