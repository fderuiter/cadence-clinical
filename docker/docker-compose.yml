version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: cadence-postgres
    profiles:
      - execution
      - operations
      - python
      - dotnet
      - hybrid
    command: postgres -c fsync=off -c synchronous_commit=off -c full_page_writes=off -c max_connections=300
    environment:
      POSTGRES_USER: cadence
      POSTGRES_PASSWORD: cadence_password # pragma: allowlist secret
      POSTGRES_DB: cadence_edc
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cadence -d cadence_edc"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-etmf:
    image: postgres:15-alpine
    container_name: cadence-postgres-etmf
    profiles:
      - operations
      - python
      - dotnet
      - hybrid
    command: postgres -c fsync=off -c synchronous_commit=off -c full_page_writes=off -c max_connections=300
    environment:
      POSTGRES_USER: cadence
      POSTGRES_PASSWORD: cadence_password # pragma: allowlist secret
      POSTGRES_DB: cadence_etmf
    ports:
      - "5433:5432"
    volumes:
      - ./postgres-etmf-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cadence -d cadence_etmf"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-ctms:
    image: postgres:15-alpine
    container_name: cadence-postgres-ctms
    profiles:
      - operations
      - python
      - dotnet
      - hybrid
    command: postgres -c fsync=off -c synchronous_commit=off -c full_page_writes=off -c max_connections=300
    environment:
      POSTGRES_USER: cadence
      POSTGRES_PASSWORD: cadence_password # pragma: allowlist secret
      POSTGRES_DB: cadence_ctms
    ports:
      - "5434:5432"
    volumes:
      - ./postgres-ctms-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cadence -d cadence_ctms"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-quality:
    image: postgres:15-alpine
    container_name: cadence-postgres-quality
    profiles:
      - operations
      - python
      - dotnet
      - hybrid
    command: postgres -c fsync=off -c synchronous_commit=off -c full_page_writes=off -c max_connections=300
    environment:
      POSTGRES_USER: cadence
      POSTGRES_PASSWORD: cadence_password # pragma: allowlist secret
      POSTGRES_DB: cadence_quality
    ports:
      - "5435:5432"
    volumes:
      - ./postgres-quality-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cadence -d cadence_quality"]
      interval: 5s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5-community
    container_name: cadence-neo4j
    profiles:
      - designer
      - python
      - dotnet
      - hybrid
    environment:
      NEO4J_AUTH: neo4j/cadence_password # pragma: allowlist secret
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider localhost:7474 || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:22.0.3
    container_name: cadence-keycloak
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin_password # pragma: allowlist secret
      - KC_DB=dev-file
      - KC_HEALTH_ENABLED=true
      - BRAND_NAME=Cadence Clinical Research Software
    ports:
      - "8080:8080"
    volumes:
      - ./cadence-realm.json:/opt/keycloak/data/import/realm.json
    command: ["start-dev", "--import-realm"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/8080 && echo -e \"GET /health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && cat <&3 | grep \"200 OK\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # Python Subsystem Containers
  # ----------------------------------------------------------------------------

  designer:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: cadence-designer
    profiles:
      - python
    command:
      [
        "python",
        "scripts/start.py",
        "designer",
        "--host",
        "0.0.0.0",
        "--port",
        "8001",
        "--reload",
      ]
    volumes:
      - ..:/app
    environment:
      - BRAND_NAME=Cadence Clinical Research Software
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=cadence_password # pragma: allowlist secret
    depends_on:
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/health || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      default:
        aliases:
          - designer

  execution:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: cadence-execution
    profiles:
      - python
    command:
      [
        "python",
        "scripts/start.py",
        "execution",
        "--host",
        "0.0.0.0",
        "--port",
        "8002",
        "--reload",
      ]
    volumes:
      - ..:/app
    environment:
      - BRAND_NAME=Cadence Clinical Research Software
      - POSTGRES_USER=cadence
      - POSTGRES_PASSWORD=cadence_password # pragma: allowlist secret
      - POSTGRES_DB=cadence_edc
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - DATABASE_URL=postgresql+asyncpg://cadence:cadence_password@postgres:5432/cadence_edc # pragma: allowlist secret
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8002/health || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      default:
        aliases:
          - execution

  gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: cadence-gateway
    profiles:
      - python
    command:
      [
        "python",
        "scripts/start.py",
        "gateway",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
      ]
    volumes:
      - ..:/app
    environment:
      - DESIGNER_URL=http://designer:8001
      - EXECUTION_URL=http://execution:8002
      - ETMF_URL=http://etmf:8003
      - CTMS_URL=http://ctms:8007
      - QUALITY_URL=http://quality:8005
      - INTEROP_URL=http://interop:8004
      - TICKETS_URL=http://tickets:8009
      - NOTIFICATIONS_URL=http://notifications:8006
      - SAFETY_URL=http://safety:8008
      - ORG_URL=http://org:8012
      - EISF_URL=http://eisf:8010
      - ECONSENT_URL=http://econsent:8011
      - FILESHARE_URL=http://fileshare:8013
      - BRAND_NAME=Cadence Clinical Research Software
      - GATEWAY_SECRET=internal-gateway-secret-12345 # pragma: allowlist secret
    expose:
      - "8000"
    ports:
      - "8000:8000"
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      default:
        aliases:
          - gateway

  org:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: cadence-org
    profiles:
      - operations
      - python
      - hybrid
    command:
      [
        "python",
        "scripts/start.py",
        "org",
        "--host",
        "0.0.0.0",
        "--port",
        "8012",
        "--reload",
      ]
    volumes:
      - ..:/app
    environment:
      - BRAND_NAME=Cadence Clinical Research Software
      - ORG_DATABASE_URL=postgresql+asyncpg://cadence:cadence_password@postgres:5432/cadence_edc # pragma: allowlist secret
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8012/health || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      default:
        aliases:
          - org

  eisf:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: cadence-eisf
    profiles:
      - operations
      - python
      - hybrid
    command:
      [
        "python",
        "scripts/start.py",
        "eisf",
        "--host",
        "0.0.0.0",
        "--port",
        "8010",
        "--reload",
      ]
    volumes:
      - ..:/app
    environment:
      - BRAND_NAME=Cadence Clinical Research Software
      - EISF_DATABASE_URL=sqlite+aiosqlite:////app/eisf.db
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8010/health || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      default:
        aliases:
          - eisf

  etmf:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: cadence-etmf
    profiles:
      - operations
      - python
      - hybrid
    command:
      [
        "python",
        "scripts/start.py",
        "etmf",
        "--host",
        "0.0.0.0",
        "--port",
        "8003",
        "--reload",
      ]
    volumes:
      - ..:/app
    environment:
      - BRAND_NAME=Cadence Clinical Research Software
      - ETMF_DATABASE_URL=postgresql+asyncpg://cadence:cadence_password@postgres-etmf:5432/cadence_etmf # pragma: allowlist secret
      - INBOUND_EMAIL_HMAC_SECRET=dev-secret-inbound-email-hmac-secure-placeholder # pragma: allowlist secret
      - INBOUND_EMAIL_MAX_SIZE_BYTES=10485760
      - NOTIFICATIONS_URL=http://notifications:8006
    depends_on:
      postgres-etmf:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8003/health || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      default:
        aliases:
          - etmf

  ctms:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: cadence-ctms
    profiles:
      - operations
      - python
      - hybrid
    command:
      [
        "python",
        "scripts/start.py",
        "ctms",
        "--host",
        "0.0.0.0",
        "--port",
        "8007",
        "--reload",
      ]
    volumes:
      - ..:/app
    environment:
      - BRAND_NAME=Cadence Clinical Research Software
      - CTMS_DATABASE_URL=postgresql+asyncpg://cadence:cadence_password@postgres-ctms:5432/cadence_ctms # pragma: allowlist secret
    depends_on:
      postgres-ctms:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8007/health || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      default:
        aliases:
          - ctms

  quality:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: cadence-quality
    profiles:
      - operations
      - python
      - hybrid
    command:
      [
        "python",
        "scripts/start.py",
        "quality",
        "--host",
        "0.0.0.0",
        "--port",
        "8005",
        "--reload",
      ]
    volumes:
      - ..:/app
    environment:
      - BRAND_NAME=Cadence Clinical Research Software
      - QUALITY_DATABASE_URL=postgresql+asyncpg://cadence:cadence_password@postgres-quality:5432/cadence_quality # pragma: allowlist secret
    depends_on:
      postgres-quality:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8005/health || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      default:
        aliases:
          - quality

  interop:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: cadence-interop
    profiles:
      - operations
      - python
      - hybrid
    command:
      [
        "python",
        "scripts/start.py",
        "interop",
        "--host",
        "0.0.0.0",
        "--port",
        "8004",
        "--reload",
      ]
    volumes:
      - ..:/app
    environment:
      - BRAND_NAME=Cadence Clinical Research Software
      - INTEROP_DATABASE_URL=sqlite+aiosqlite:////app/interop.db
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8004/health || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      default:
        aliases:
          - interop

  tickets:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: cadence-tickets
    profiles:
      - operations
      - python
      - hybrid
    command:
      [
        "python",
        "scripts/start.py",
        "tickets",
        "--host",
        "0.0.0.0",
        "--port",
        "8009",
        "--reload",
      ]
    volumes:
      - ..:/app
    environment:
      - BRAND_NAME=Cadence Clinical Research Software
      - TICKETS_DATABASE_URL=sqlite+aiosqlite:////app/tickets.db
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8009/health || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      default:
        aliases:
          - tickets

  safety:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: cadence-safety
    profiles:
      - operations
      - python
      - hybrid
    command:
      [
        "python",
        "scripts/start.py",
        "safety",
        "--host",
        "0.0.0.0",
        "--port",
        "8008",
        "--reload",
      ]
    volumes:
      - ..:/app
    environment:
      - BRAND_NAME=Cadence Clinical Research Software
      - SAFETY_DATABASE_URL=sqlite+aiosqlite:////app/safety.db
      - SAFETY_SALT=internal-safety-salt-12345
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8008/health || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      default:
        aliases:
          - safety

  notifications:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: cadence-notifications
    profiles:
      - operations
      - python
      - hybrid
    command:
      [
        "python",
        "scripts/start.py",
        "notifications",
        "--host",
        "0.0.0.0",
        "--port",
        "8006",
        "--reload",
      ]
    volumes:
      - ..:/app
    environment:
      - BRAND_NAME=Cadence Clinical Research Software
      - NOTIFICATIONS_DATABASE_URL=sqlite+aiosqlite:////app/notifications.db
      - SMTP_HOST=smtp.mailhog.local
      - SMTP_PORT=1025
      - SMTP_USERNAME=dev_user
      - SMTP_PASSWORD=dev_password # pragma: allowlist secret
      - SMTP_USE_TLS=false
      - SMTP_USE_SSL=false
      - SMTP_SENDER=no-reply@ccrsoft.com
      - WEBHOOK_URL=http://webhooks.local/receiver
      - WEBHOOK_SIGNING_SECRET=dev_webhook_secret_key_12345 # pragma: allowlist secret
      - WEBHOOK_TIMEOUT=5.0
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8006/health || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      default:
        aliases:
          - notifications

  econsent:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: cadence-econsent
    profiles:
      - operations
      - python
      - hybrid
    command:
      [
        "python",
        "scripts/start.py",
        "econsent",
        "--host",
        "0.0.0.0",
        "--port",
        "8011",
        "--reload",
      ]
    volumes:
      - ..:/app
    environment:
      - BRAND_NAME=Cadence Clinical Research Software
      - ECONSENT_DATABASE_URL=sqlite+aiosqlite:////app/econsent.db
      - GATEWAY_URL=http://gateway:8000
      - GATEWAY_SECRET=internal-gateway-secret-12345 # pragma: allowlist secret
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8011/health || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      default:
        aliases:
          - econsent

  fileshare:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: cadence-fileshare
    profiles:
      - operations
      - python
      - hybrid
    command:
      [
        "python",
        "scripts/start.py",
        "fileshare",
        "--host",
        "0.0.0.0",
        "--port",
        "8013",
        "--reload",
      ]
    volumes:
      - ..:/app
    environment:
      - BRAND_NAME=Cadence Clinical Research Software
      - FILESHARE_DATABASE_URL=sqlite+aiosqlite:////app/fileshare.db
      - GATEWAY_URL=http://gateway:8000
      - GATEWAY_SECRET=internal-gateway-secret-12345 # pragma: allowlist secret
      - STORAGE_ENDPOINT_URL=http://minio:9000
      - STORAGE_BUCKET=cadence-fileshare
      - STORAGE_ACCESS_KEY=minio_admin
      - STORAGE_SECRET_KEY=minio_password # pragma: allowlist secret
      - CLAMAV_HOST=clamav
      - CLAMAV_PORT=3310
      - CLAMAV_ENABLED=true
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      clamav:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8013/health || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      default:
        aliases:
          - fileshare

  clamav:
    image: clamav/clamav:stable
    container_name: cadence-clamav
    profiles:
      - operations
      - python
      - dotnet
      - hybrid
    ports:
      - "3310:3310"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "echo PING | nc -w 2 127.0.0.1 3310 | grep PONG || exit 0",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  fileshare-transcoder:
    build:
      context: ..
      dockerfile: docker/fileshare-transcoder/Dockerfile
    container_name: cadence-fileshare-transcoder
    profiles:
      - operations
      - python
      - dotnet
      - hybrid
    volumes:
      - ..:/app
    environment:
      - BRAND_NAME=Cadence Clinical Research Software
      - FILESHARE_DATABASE_URL=sqlite+aiosqlite:////app/fileshare.db
      - GATEWAY_URL=http://gateway:8000
      - GATEWAY_SECRET=internal-gateway-secret-12345 # pragma: allowlist secret
      - STORAGE_ENDPOINT_URL=http://minio:9000
      - STORAGE_BUCKET=cadence-fileshare
      - STORAGE_ACCESS_KEY=minio_admin
      - STORAGE_SECRET_KEY=minio_password # pragma: allowlist secret
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      fileshare:
        condition: service_started

  subject-portal:
    image: node:20-alpine
    container_name: cadence-subject-portal
    working_dir: /app
    command:
      [
        "sh",
        "-c",
        "npm install -g pnpm && pnpm config set confirmModulesPurge false && CI=true pnpm install && pnpm --filter subject-portal dev --host 0.0.0.0 --port 5174",
      ]
    volumes:
      - ..:/app
    ports:
      - "5174:5174"
    depends_on:
      gateway:
        condition: service_started

  front-proxy:
    image: nginx:1.25-alpine
    container_name: cadence-front-proxy
    ports:
      - "8000:8000"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      gateway:
        condition: service_started

  gateway-rewrite:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: cadence-gateway-rewrite
    command: ["node", "packages/gateway-rewrite/dist/index.js"]
    volumes:
      - ..:/app
    environment:
      - BRAND_NAME=Cadence Clinical Research Software
    expose:
      - "3000"
    depends_on:
      keycloak:
        condition: service_healthy

  minio:
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    container_name: cadence-minio
    profiles:
      - operations
      - python
      - dotnet
      - hybrid
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minio_admin
      - MINIO_ROOT_PASSWORD=minio_password # pragma: allowlist secret
      - BRAND_NAME=Cadence Clinical Research Software
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # .NET Subsystem Containers (Central Parameterized Build Template)
  # ----------------------------------------------------------------------------

  gateway-dotnet:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dotnet
      args:
        APP_NAME: gateway
        PROJECT_PATH: apps/gateway/src
    container_name: cadence-gateway-dotnet
    profiles:
      - dotnet
      - hybrid
    ports:
      - "8000:8000"
    volumes:
      - ..:/workspace
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - DESIGNER_URL=http://designer:8001
      - EXECUTION_URL=http://execution:8002
      - ETMF_URL=http://etmf:8003
      - CTMS_URL=http://ctms:8007
      - QUALITY_URL=http://quality:8005
      - INTEROP_URL=http://interop:8004
      - TICKETS_URL=http://tickets:8009
      - NOTIFICATIONS_URL=http://notifications:8006
      - SAFETY_URL=http://safety:8008
      - ORG_URL=http://org:8012
      - EISF_URL=http://eisf:8010
      - ECONSENT_URL=http://econsent:8011
      - FILESHARE_URL=http://fileshare:8013
      - BRAND_NAME=Cadence Clinical Research Software
