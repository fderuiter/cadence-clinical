# Opt-in TLS front-proxy configuration for Cadence Clinical.
# Mount over /etc/nginx/conf.d/default.conf (see docker/docker-compose.tls.yml) with a certificate
# pair at /etc/nginx/certs/tls.crt and /etc/nginx/certs/tls.key.

upstream cadence_gateway {
    server gateway:8080;
    keepalive 32;
}

map $http_host $forwarded_host {
    default $http_host;
    ""      $host;
}

# Plain HTTP listener: preserve internal /_proxy_health probe and redirect external callers to HTTPS.
server {
    listen 80;
    listen [::]:80;
    listen 8000;
    server_name _;

    # Proxy internal health probe stays on plain HTTP for container orchestrators.
    location = /_proxy_health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","proxy":"front-proxy"}';
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

# Public TLS termination listener forwarding scheme and host metadata to the API gateway.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    ssl_certificate /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Docker embedded DNS resolver for dynamic service resolution
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Request and response buffer limits for large JWKS & cryptographic headers
    client_max_body_size 50M;
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    # Header and body forwarding defaults
    proxy_pass_request_headers on;
    proxy_pass_request_body on;

    # Standard proxy forwarded headers
    proxy_set_header Host $forwarded_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $forwarded_host;
    proxy_set_header X-Forwarded-Port $server_port;

    # Identity, OIDC, and Trace-17 header propagation
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Sig-Token $http_x_sig_token;
    # Internal service-to-service header: never accept it from outside the stack.
    proxy_set_header X-Gateway-Secret "";
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header X-Trace-ID $http_x_trace_id;

    # WebSocket & HTTP/1.1 keepalive support
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # Proxy internal health probe
    location = /_proxy_health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","proxy":"front-proxy"}';
    }

    # Core gateway proxy location
    location / {
        proxy_pass http://cadence_gateway;
    }
}
