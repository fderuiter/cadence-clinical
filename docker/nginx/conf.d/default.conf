# API gateway upstream (apps/gateway listens on 8080 inside its container)
upstream cadence_gateway {
    server gateway:8080;
    keepalive 32;
}

server {
    listen 8000;
    server_name localhost;

    # Docker embedded DNS resolver for dynamic service resolution
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Request and response buffer limits for large JWKS & cryptographic headers
    client_max_body_size 50M;
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    # Header and body forwarding defaults
    proxy_pass_request_headers on;
    proxy_pass_request_body on;

    # Standard proxy forwarded headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;

    # Identity, OIDC, and Trace-17 header propagation
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Sig-Token $http_x_sig_token;
    # Internal service-to-service header: never accept it from outside the stack.
    proxy_set_header X-Gateway-Secret "";
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header X-Trace-ID $http_x_trace_id;

    # WebSocket & HTTP/1.1 keepalive support
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # Proxy internal health probe
    location /_proxy_health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","proxy":"front-proxy"}';
    }

    # Core gateway proxy location
    location / {
        proxy_pass http://cadence_gateway;
    }
}
