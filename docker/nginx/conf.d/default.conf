# Active API Gateway Upstream Targets
upstream gateway_fastapi {
    server gateway:8000;
    keepalive 32;
}

upstream gateway_nestjs {
    server gateway-rewrite:3000;
    keepalive 32;
}

# Percentage-based traffic splitting across gateway containers
split_clients "$request_id" $split_gateway {
    0%      gateway_nestjs;
    *       gateway_fastapi;
}

# Path-based overrides map
map $uri $gateway_upstream {
    # Direct service paths explicitly to a target gateway (canary overrides)
    ~^/designer(/|$)    gateway_nestjs;
    
    # Fall back to percentage-based split for all other traffic
    default             $split_gateway;
}

server {
    listen 8000;
    server_name localhost;

    # Docker embedded DNS resolver for dynamic service resolution
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Request and response buffer limits for large JWKS & cryptographic headers
    client_max_body_size 50M;
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    # Header and body forwarding defaults
    proxy_pass_request_headers on;
    proxy_pass_request_body on;

    # Standard proxy forwarded headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;

    # Identity, OIDC, and Trace-17 header propagation
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Sig-Token $http_x_sig_token;
    proxy_set_header X-Gateway-Secret $http_x_gateway_secret;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header X-Trace-ID $http_x_trace_id;

    # WebSocket & HTTP/1.1 keepalive support
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # Proxy internal health probe
    location /_proxy_health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","proxy":"front-proxy"}';
    }

    # Core gateway proxy location
    location / {
        proxy_pass http://$gateway_upstream;
    }
}
