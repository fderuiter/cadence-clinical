[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "packages-core-models"
version = "0.1.0"
description = "Core models and utility packages"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.6.0",
    "usdm>=0.65.0",
    "pyyaml>=6.0.1",
    "python-docx>=1.1.0",
    "weasyprint>=61.0",
    "jinja2>=3.1.6,<4.0.0",
    "docxcompose>=2.2.0",
    "docxtpl>=0.20.2",
    "PyMuPDF>=1.24.0",
]

[tool.hatch.build.targets.wheel]
packages = [
    "sae_icsr",
    "ctms",
    "localization",
    "organization_domain",
    "cdisc",
    "protocol_authoring",
    "protocol_version_ref",
    "storage",
    "tmf_reference_model",
    "etmf",
    "notifications",
    "sdtm",
    "protocol_render",
    "eligibility",
]
