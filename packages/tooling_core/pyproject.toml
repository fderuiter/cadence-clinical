[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "packages-tooling-core"
version = "0.1.0"
description = "Cadence Clinical Unified Tooling Core Package"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
exclude = ["tests"]

[tool.hatch.build.targets.wheel.sources]
"" = "packages/tooling_core"
