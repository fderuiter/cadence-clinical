[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "packages-database"
version = "0.1.0"
description = "Database utilities package"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "fastapi>=0.139.2,<0.140.0",
    "pydantic>=2.6.0",
    "sqlalchemy>=2.0.28",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

