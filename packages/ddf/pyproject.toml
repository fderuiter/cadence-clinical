[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[project]
name = "packages-ddf"
version = "0.1.0"
description = "Digital Data Flow (DDF) Deep Compiler Pipeline"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.6.0",
    "defusedxml>=0.7.1,<0.8.0",
    "jinja2>=3.1.6,<4.0.0",
]

[tool.hatch.build.targets.wheel]
packages = [
    ".",
]
exclude = [
    "tests",
]

[tool.hatch.build.targets.wheel.sources]
"" = "packages/ddf"
