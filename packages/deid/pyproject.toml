[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "packages-deid"
version = "0.1.0"
description = "De-identification utilities package"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.6.0",
    "pyyaml>=6.0.1",
    "rapidfuzz>=3.14.5",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

