[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[project]
name = "packages-core"
version = "0.1.0"
description = "Core utilities and datetime primitives package"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.6.0",
]

[tool.hatch.build.targets.wheel]
packages = [
    ".",
]
exclude = [
    "tests",
]

[tool.hatch.build.targets.wheel.sources]
"" = "packages/core"
