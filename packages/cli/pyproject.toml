[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[project]
name = "packages-cli"
version = "0.1.0"
description = "Cadence Clinical Developer Experience and Unified CLI"
requires-python = ">=3.14"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "httpx>=0.27.0",
    "packages-tooling-core",
    "packages-testing",
]

[tool.hatch.build.targets.wheel]
packages = [
    ".",
]
exclude = [
    "tests",
]

[tool.hatch.build.targets.wheel.sources]
"" = "packages/cli"
