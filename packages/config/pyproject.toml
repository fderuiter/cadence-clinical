[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[project]
name = "packages-config"
version = "0.1.0"
description = "Centralized Pydantic configuration and settings package"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
]

[tool.hatch.build.targets.wheel]
packages = [
    ".",
]
exclude = [
    "tests",
]

[tool.hatch.build.targets.wheel.sources]
"" = "packages/config"
