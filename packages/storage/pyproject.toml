[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "packages-storage"
version = "0.1.0"
description = "Storage utilities package"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.6.0",
    "boto3>=1.34.0",
    "aioboto3>=13.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
