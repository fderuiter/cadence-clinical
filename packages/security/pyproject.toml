[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[project]
name = "packages-security"
version = "0.1.0"
description = "Security utilities package"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.139.2,<0.140.0",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "python-jose[cryptography]>=3.3.0",
    "ecdsa>=0.19.2",
    "cryptography>=4.5.0",
    "redis>=5.0.0",
]

[tool.hatch.build.targets.wheel]
packages = [
    ".",
]
exclude = [
    "tests",
]

[tool.hatch.build.targets.wheel.sources]
"" = "packages/security"
