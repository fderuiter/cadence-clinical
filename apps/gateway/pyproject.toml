[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[project]
name = "apps-gateway"
version = "0.1.0"
description = "Gateway microservice"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.139.2,<0.140.0",
    "pydantic>=2.6.0",
    "httpx>=0.27.0",
    "uvicorn[standard]>=0.51.0,<0.52.0",
    "packages-security",
]

[tool.hatch.build.targets.wheel]
packages = [
    ".",
]
exclude = [
    "tests",
]

[tool.hatch.build.targets.wheel.sources]
"" = "apps/gateway"
