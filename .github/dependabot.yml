version: 2
updates:
  # .NET dependencies (Central Package Management: Directory.Build.props + Directory.Packages.props + .config/dotnet-tools.json)
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
    groups:
      dotnet-10-servicing:
        patterns:
          - "Microsoft.AspNetCore.*"
          - "Microsoft.EntityFrameworkCore*"
          - "Microsoft.Extensions.*"
          - "System.Security.Cryptography.*"
          - "System.IO.*"
        exclude-patterns:
          - "Microsoft.Extensions.AI*"
      dotnet-ai:
        patterns:
          - "Microsoft.Extensions.AI*"
      aspire:
        patterns:
          - "Aspire.*"
      identitymodel:
        patterns:
          - "Microsoft.IdentityModel.*"
          - "System.IdentityModel.*"
      opentelemetry:
        patterns:
          - "OpenTelemetry*"
      masstransit:
        patterns:
          - "MassTransit*"
      fluentvalidation:
        patterns:
          - "FluentValidation*"
      ai-providers:
        patterns:
          - "Anthropic*"
          - "ModelContextProtocol*"
      code-analyzers:
        patterns:
          - "Microsoft.CodeAnalysis.*"
          - "SonarAnalyzer*"
      dotnet-testing:
        patterns:
          - "xunit*"
          - "Microsoft.NET.Test.Sdk"
          - "FluentAssertions*"
          - "NSubstitute*"
          - "Testcontainers*"
          - "coverlet*"
          - "TngTech.ArchUnitNET*"
      nuget-dependencies:
        patterns:
          - "*"
    ignore:
      # MassTransit 9 is commercial and needs a license key; 8.x stays under Apache 2.0 (#5520, ADR-2524).
      - dependency-name: "MassTransit*"
        update-types: ["version-update:semver-major"]
      # .NET major versions are locked to .NET 10 across global.json and Directory.Build.props (ADR-2233, ADR-2527).
      - dependency-name: "Microsoft.AspNetCore.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.EntityFrameworkCore*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.Extensions.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "System.Security.Cryptography.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "System.IO.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "dotnet-ef"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Aspire.*"
        update-types: ["version-update:semver-major"]
      # AWSSDK.Core >= 4.1.0 pulls System.IO.Hashing 11.0.0; stay on 4.0.x while targeting net10.0.
      - dependency-name: "AWSSDK.*"
        versions: [">= 4.1.0"]
      # Fluid.Core 3.x removes mutable MemberAccessStrategy/MemberNameStrategies used by FluidTemplateRenderer (#5948, ADR-2823).
      - dependency-name: "Fluid.Core"
        update-types: ["version-update:semver-major"]
      # NetAnalyzers 11.x targets the .NET 11 SDK wave and escalates rules conflicting with Clinical Kernel API names (#5949, ADR-2233, ADR-2823).
      - dependency-name: "Microsoft.CodeAnalysis.NetAnalyzers"
        update-types: ["version-update:semver-major"]

  # Node.js workspace dependency updates (pnpm / package.json / pnpm-workspace.yaml catalog; single active lockfile PR)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "wednesday"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
      - "nodejs"
    groups:
      npm-workspace:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      npm-workspace-major:
        patterns:
          - "*"
        update-types:
          - "major"
    ignore:
      # Node runtime baseline is pinned via package.json engines (ADR-2508).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # Container base images, pinned by version and digest (docker/Dockerfile.dotnet)
  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"
      day: "tuesday"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
    groups:
      dotnet-containers:
        patterns:
          - "mcr.microsoft.com/dotnet/*"
          - "dotnet/*"
    ignore:
      # .NET major versions are pinned by global.json and Directory.Build.props (ADR-2233).
      - dependency-name: "mcr.microsoft.com/dotnet/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "dotnet/*"
        update-types: ["version-update:semver-major"]

  # Statistical computing execution (SCE) base images, pinned by version and digest
  - package-ecosystem: "docker"
    directory: "/docker/sce/python"
    schedule:
      interval: "weekly"
      day: "thursday"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
    groups:
      sce-python:
        patterns:
          - "*"
    ignore:
      # GxP SCE Python baseline is locked to Python 3.14 (ADR-2327, interop_openapi.json); allow 3.14 digest updates only.
      - dependency-name: "python"
        update-types:
          ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: "docker"
    directory: "/docker/sce/r"
    schedule:
      interval: "weekly"
      day: "thursday"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
    groups:
      sce-r:
        patterns:
          - "*"
    ignore:
      # GxP SCE R baseline is locked to R 4.4.2 (interop_openapi.json); allow 4.4.2 digest updates only.
      - dependency-name: "r-base"
        update-types:
          [
            "version-update:semver-major",
            "version-update:semver-minor",
            "version-update:semver-patch",
          ]

  # Local stack images, pinned by digest (docker/docker-compose.yml)
  - package-ecosystem: "docker-compose"
    directory: "/docker"
    schedule:
      interval: "weekly"
      day: "tuesday"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
    groups:
      local-stack:
        patterns:
          - "*"

  # GitHub Actions workflow updates
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
      - "actions"
    groups:
      workflow-actions:
        patterns:
          - "*"
