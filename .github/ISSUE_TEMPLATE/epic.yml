name: Epic
description: A multi-issue initiative. Child issues are linked as native sub-issues.
title: "[Epic] "
labels: ["epic"]
body:
  - type: markdown
    attributes:
      value: |
        Open an epic only when the work doesn't fit an existing one (kernel #4719, security and GxP defects #4759, hygiene #4760, web app onto the .NET API #4833).

  - type: textarea
    id: finding
    attributes:
      label: Finding
      description: The problem or goal, with the evidence behind it.
    validations:
      required: true

  - type: textarea
    id: plan
    attributes:
      label: Plan
      description: Ordered steps, what each makes usable, and what each depends on. Link each step's issue as a sub-issue.
    validations:
      required: true

  - type: textarea
    id: rules
    attributes:
      label: Rules for every step
      description: Constraints each child PR must follow (for example, no mock fallbacks, docs in the same PR).
    validations:
      required: false

  - type: input
    id: refs
    attributes:
      label: Spec/ADR refs
    validations:
      required: false
