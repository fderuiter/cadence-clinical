name: Bug report
description: Report a reproducible defect with its impact and expected result.
labels:
  - type:bug
  - status:needs-triage
body:
  - type: markdown
    attributes:
      value:
        Use synthetic data only. Never include credentials, PHI, or real participant data. Report vulnerabilities
        privately through SECURITY.md.
  - type: dropdown
    id: area
    attributes:
      label: Primary area
      options:
        - Kernel and trust (packages/kernel, gateway, security)
        - Capture and Clinical Canvas (execution, apps/web)
        - Study design and Blueprint (designer, USDM, DDF)
        - Clinical operations and evidence (consent, safety, quality, interop)
        - Engineering (CLI, CI, tests, documentation)
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem and impact
      description:
        Describe the affected workflow, its impact, and any workaround. State whether evidence
        or audit integrity is affected.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description:
        Provide the smallest synthetic reproduction, command or navigation path, and inspected
        commit.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What observable result should occur?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead? Include exact errors.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description:
        Commit, .NET/Node/browser versions, startup preset, database version, and relevant synthetic
        role/site.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and evidence
      description: Include sanitized stack traces, screenshots, test output, and links.
    validations:
      required: false
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Describe a binary observable regression check.
      value: "- [ ] The reproduction produces the expected result and the relevant regression check passes."
    validations:
      required: true
