name: Bug report
description: Something behaves wrongly. Give the evidence so it can be reproduced and fixed.
title: "[Bug] "
labels: ["type: bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Never paste secrets, PHI or real participant data. Report security vulnerabilities privately (see SECURITY.md).

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - "Kernel (packages/kernel)"
        - "Execution / EDC (apps/execution)"
        - "Gateway, security and identity"
        - "Web app and Clinical Canvas (apps/web, packages/ui)"
        - "Other module (apps/*)"
        - "Standards, validation and submission (CDISC, rules)"
        - "CLI, quality gates, CI and developer setup"
        - "Documentation"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happens, and what should happen instead. Say whether it affects regulated data or the audit trail.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Steps to reproduce, the failing command or test, and `file:line` references at a commit.
      placeholder: |
        1. `dotnet test tests/Cadence.UnitTests.csproj --filter ...`
        2. apps/execution/src/Application/Subjects/SubjectApplicationService.cs:120 @ abc1234
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How we know it's fixed. Include the regression test that must pass.
      value: |
        - [ ] A test reproduces the bug and passes after the fix.
    validations:
      required: true

  - type: input
    id: refs
    attributes:
      label: Spec/ADR refs
      description: Kernel spec rules (for example K-AUTH-4), ADRs or requirement IDs (PRD-SYS-xxx) this touches.
    validations:
      required: false
