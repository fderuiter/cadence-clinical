name: Scoped feature request
description: For agreed, vision-aligned work. Discuss raw ideas first.
labels:
  - type:feature
  - status:needs-triage
body:
  - type: markdown
    attributes:
      value:
        Use synthetic data only. Never include credentials, PHI, or real participant data. Report vulnerabilities
        privately through SECURITY.md.
  - type: dropdown
    id: area
    attributes:
      label: Primary area
      options:
        - Kernel and trust (packages/kernel, gateway, security)
        - Capture and Clinical Canvas (execution, apps/web)
        - Study design and Blueprint (designer, USDM, DDF)
        - Clinical operations and evidence (consent, safety, quality, interop)
        - Engineering (CLI, CI, tests, documentation)
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem and vision alignment
      description: What user problem does this solve? Link the discussion and current project-plan milestone.
    validations:
      required: true
  - type: checkboxes
    id: vision
    attributes:
      label: Vision alignment
      options:
        - label: This supports the current synthetic-study pilot and the single-repository project plan.
          required: true
  - type: textarea
    id: outcome
    attributes:
      label: Proposed outcome
      description: Describe the user-observable result and expected value.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and non-goals
      description: Describe the smallest useful increment and explicit exclusions.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List binary, testable outcomes.
      value: "- [ ] The scoped user outcome can be demonstrated with synthetic data."
    validations:
      required: true
  - type: textarea
    id: questions
    attributes:
      label: Dependencies and open questions
      description: Link prerequisites and identify decisions still needed.
    validations:
      required: false
