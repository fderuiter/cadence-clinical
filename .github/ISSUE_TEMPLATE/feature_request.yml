name: Feature or task
description: New behavior or a scoped piece of work. Most work belongs under one of the epics.
labels: ["type: feature", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Work is tracked under the epics: kernel #4719, security and GxP defects #4759, hygiene #4760 and web app onto the .NET API #4833. Add this issue as a sub-issue of the right one.
        A new domain concept follows docs/kernel/CLINICAL_KERNEL_SPECIFICATION.md. It belongs in the kernel if it's needed to explain the provenance, authority, meaning or lifecycle of clinical evidence across products.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - "Kernel (packages/kernel)"
        - "Execution / EDC (apps/execution)"
        - "Gateway, security and identity"
        - "Web app and Clinical Canvas (apps/web, packages/ui)"
        - "Other module (apps/*)"
        - "Standards, validation and submission (CDISC, rules)"
        - "CLI, quality gates, CI and developer setup"
        - "Documentation"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: The user need or gap, in the words of the people who have it (site user, CRA, data manager, sponsor, inspector).
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Where the gap shows, with `file:line` references at a commit, and the files you expect to change.
    validations:
      required: false

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Testable outcomes. Regulated behavior needs a test tagged with its requirement (`[GxPRequirement("PRD-SYS-xxx")]`).
      value: |
        - [ ]
        - [ ] Tests added in `tests/` (xUnit) or next to the frontend package (Vitest).
        - [ ] Docs affected by the change are updated in the same PR.
    validations:
      required: true

  - type: input
    id: refs
    attributes:
      label: Spec/ADR refs
      description: Kernel spec rules (for example K-TIME-4), ADRs and requirement IDs. If this needs a new ADR, create it with `pnpm cadence scaffold adr "<title>"`.
    validations:
      required: false

  - type: textarea
    id: depends
    attributes:
      label: Depends on
      description: Issues or PRs that must land first, one per line (`- #123`).
    validations:
      required: false
