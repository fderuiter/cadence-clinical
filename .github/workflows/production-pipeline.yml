name: Production Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  release-and-promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install UV Package Manager
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install Dependencies
        run: |
          uv venv
          echo ".venv/bin" >> $GITHUB_PATH
          uv pip install -e .[dev]

      - name: Run Fully Automated Continuous Delivery Pipeline
        env:
          CHANGE_TICKET_ID: "CHG-AUTO-PROMOTE-PRODUCTION"
          QA_OFFICER_JWT: ${{ secrets.QA_OFFICER_JWT }}
          MOCK_AUDIT_SERVICE: "true"
          MOCK_ETMF_SERVICE: "true"
          DATABASE_URL: "sqlite+aiosqlite:///production.db"
          GITHUB_SHA: ${{ github.sha }}
        run: |
          python scripts/deploy_production.py --image-tag "${{ github.sha }}" --color "blue"

