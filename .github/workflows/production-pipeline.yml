name: Production Pipeline

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-and-archive:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    # tests/Cadence.IntegrationTests and tests/Cadence.E2ETests run against this database during `gxp snapshot`;
    # without CADENCE_TEST_POSTGRES they would skip and fail DatabaseTestEvidence (ADR-2533, docs/TESTING.md).
    services:
      postgres:
        image: postgres:18-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
        env:
          POSTGRES_USER: cadence
          # A throwaway database on the runner; no credential is needed or stored.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: cadence
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cadence"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CADENCE_TEST_POSTGRES: Host=localhost;Port=5432;Database=cadence;Username=cadence
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Create Isolated Output Directory
        run: mkdir -p tmp_etmf

      # Set up pnpm and Node.js for frontend vulnerability audit
      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      # Set up .NET SDK and restore C# packages for .NET vulnerability audit
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            global.json
            Directory.Build.props
            Directory.Packages.props
            **/*.csproj

      - name: Cache Cadence CLI
        id: cadence-cli-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ./bin/cadence
          key: cadence-cli-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.Build.props', 'Directory.Build.targets', 'Directory.Packages.props', 'NuGet.Config', 'BannedSymbols.txt', 'packages/cli/src/**', 'packages/engine_core/src/**', 'packages/database/src/**', 'packages/compliance/src/**', 'packages/security/src/**', 'packages/tooling_core/src/**', 'packages/kernel/src/Cadence.Kernel.Abstractions/**', 'packages/core-models/src/**', 'packages/deid/src/**', 'packages/topology/src/**') }}

      - name: Restore NuGet Packages
        run: dotnet restore Cadence.sln

      # Run GxP Dependency & Vulnerability Audit Gate
      - name: Run GxP Dependency Validation
        env:
          CADENCE_CLI_CACHE_HIT: ${{ steps.cadence-cli-cache.outputs.cache-hit }}
        run: |
          python3 -m venv "$RUNNER_TEMP/pip-audit-venv"
          "$RUNNER_TEMP/pip-audit-venv/bin/python" -m pip install --quiet --upgrade pip pip-audit==2.10.1
          export PATH="$RUNNER_TEMP/pip-audit-venv/bin:$PATH"
          node scripts/run-cli.js check vulnerabilities

      - name: Download Verified .NET Test Evidence
        if: github.event_name != 'workflow_dispatch'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: gxp-test-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: TestResults/gxp

      - name: Execute .NET Test Suite (Manual Dispatch)
        if: github.event_name == 'workflow_dispatch'
        env:
          CADENCE_TEST_EVIDENCE_DIR: ${{ github.workspace }}/TestResults/gxp
        run: |
          dotnet build Cadence.sln --configuration Release --no-restore
          dotnet test Cadence.sln --configuration Release --no-build --results-directory TestResults/gxp --logger "trx;LogFilePrefix=gxp"
          bash scripts/test-check-database-test-results.sh
          bash scripts/check-database-test-results.sh

      # Delete the committed copies first so a sync that exits 0 without
      # writing them fails the verify step instead of archiving stale reports.
      # A release is a snapshot (ADR-2532): only `gxp snapshot` writes docs/SDLC.
      # Reusable calls from ci.yml inherit the caller's event_name ('push') and download TestResults/gxp;
      # manual workflow_dispatch populates TestResults/gxp above before the committed copies are removed.
      - name: Generate GxP Reports
        env:
          CADENCE_CLI_CACHE_HIT: ${{ steps.cadence-cli-cache.outputs.cache-hit }}
          CADENCE_GXP_SNAPSHOT: "1"
        run: |
          rm -f docs/SDLC/Requirements_Traceability_Matrix.md docs/SDLC/IQ_OQ_PQ_Execution_Report.md
          node scripts/run-cli.js gxp snapshot --results-dir TestResults/gxp

      - name: Verify and Stage Generated Reports
        run: |
          for report in Requirements_Traceability_Matrix.md IQ_OQ_PQ_Execution_Report.md; do
            if [ ! -s "docs/SDLC/$report" ]; then
              echo "::error::gxp snapshot did not generate docs/SDLC/$report"
              exit 1
            fi
            cp "docs/SDLC/$report" tmp_etmf/
          done
          (cd tmp_etmf && sha256sum -- *.md > SHA256SUMS && sha256sum -c SHA256SUMS)
          cat tmp_etmf/SHA256SUMS

      - name: Generate SLSA Build Provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "tmp_etmf/*"

      # No eTMF integration exists yet, so the release evidence is kept as a
      # workflow artifact with its checksum manifest.
      - name: Upload Release Evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: gxp-release-evidence-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: tmp_etmf/
          if-no-files-found: error
          retention-days: 90
