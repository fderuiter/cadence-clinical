name: Production Pipeline

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-and-archive:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Create Isolated Output Directory
        run: mkdir -p tmp_etmf

      # Set up pnpm and Node.js for frontend vulnerability audit
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: "pnpm"

      # Set up .NET SDK and restore C# packages for .NET vulnerability audit
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            global.json

      - name: Restore NuGet Packages
        run: dotnet restore Cadence.sln

      # Run GxP Dependency & Vulnerability Audit Gate
      - name: Run GxP Dependency Validation
        run: |
          node scripts/run-cli.js check vulnerabilities

      # Delete the committed copies first so a sync that exits 0 without
      # writing them fails the verify step instead of archiving stale reports.
      # A release is a snapshot (ADR-2532): only `gxp snapshot` writes docs/SDLC.
      - name: Generate GxP Reports
        env:
          CADENCE_GXP_SNAPSHOT: "1"
        run: |
          rm -f docs/SDLC/Requirements_Traceability_Matrix.md docs/SDLC/IQ_OQ_PQ_Execution_Report.md
          node scripts/run-cli.js gxp snapshot

      - name: Verify and Stage Generated Reports
        run: |
          for report in Requirements_Traceability_Matrix.md IQ_OQ_PQ_Execution_Report.md; do
            if [ ! -s "docs/SDLC/$report" ]; then
              echo "::error::gxp snapshot did not generate docs/SDLC/$report"
              exit 1
            fi
            cp "docs/SDLC/$report" tmp_etmf/
          done
          (cd tmp_etmf && sha256sum -- *.md > SHA256SUMS)
          cat tmp_etmf/SHA256SUMS

      - name: Generate SLSA Build Provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "tmp_etmf/*"

      # No eTMF integration exists yet, so the release evidence is kept as a
      # workflow artifact with its checksum manifest.
      - name: Upload Release Evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: gxp-release-evidence-${{ github.sha }}
          path: tmp_etmf/
          if-no-files-found: error
          retention-days: 90
