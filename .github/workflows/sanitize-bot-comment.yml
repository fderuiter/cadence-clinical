name: Sanitize CI/CD Fix Bot Comment

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.comment.id }}
  cancel-in-progress: false

jobs:
  sanitize-comment:
    # 1. Ensure this comment is on a Pull Request (not an issue)
    # 2. Restrict execution to github-actions[bot] (GITHUB_TOKEN cannot edit comments created by other GitHub Apps)
    # 3. Ensure the comment body contains "[CI/CD Fix Attempt "
    if: >-
      github.event.issue.pull_request != null &&
      github.event.comment.user.type == 'Bot' &&
      github.event.comment.user.login == 'github-actions[bot]' &&
      contains(github.event.comment.body, '[CI/CD Fix Attempt ')
    runs-on: ubuntu-latest
    permissions:
      issues: write # Required to edit comments on PRs

    steps:
      - name: Update Comment Body
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const commenter = context.payload.comment?.user;
            if (!commenter || commenter.type !== 'Bot' || commenter.login !== 'github-actions[bot]') {
              console.log('Skipping comment from actor not editable by GITHUB_TOKEN.');
              return;
            }

            const commentId = context.payload.comment.id;
            const originalBody = context.payload.comment.body;

            // Matches "[CI/CD Fix Attempt <number>]" or similar variations and replaces with "[CI/CD Fix]"
            const updatedBody = originalBody.replace(/\[CI\/CD Fix Attempt \d+\]/g, '[CI/CD Fix]');

            // Only issue an API call if a change actually occurred
            if (updatedBody !== originalBody) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: commentId,
                body: updatedBody
              });
              console.log(`Successfully updated comment ${commentId}`);
            }
