name: Remove Jules Labels

on:
  schedule:
    # Runs at 00:00 UTC every day (every 24 hours)
    - cron: '0 0 * * *'
  workflow_dispatch:

concurrency:
  group: remove-jules-labels
  cancel-in-progress: false

jobs:
  remove-jules-labels:
    name: Remove Jules Labels from GitHub Issues
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Jules Label Removal Script
        env:
          GH_TOKEN: ${{ secrets.PAT_FDERUITER || secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/remove_jules_labels.py
