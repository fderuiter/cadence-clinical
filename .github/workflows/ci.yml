name: CI

on:
  push:
    branches: [main, release/*]
  pull_request:
    branches: [main, release/*]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  actionlint:
    name: Workflow Action Pinning & Actionlint Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run actionlint
        uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12

      - name: Verify third-party action SHA pinning
        run: python3 scripts/check-action-pinning.py

  lint-and-static:
    name: Lint and Static Verification
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Build UI package
        run: pnpm --filter ui build

      - name: Run frontend style and lint
        run: |
          pnpm --filter web --filter subject-portal --filter ui exec prettier --check .
          pnpm -r lint

      - name: Run Hadolint on Dockerfiles
        run: |
          if ! command -v hadolint >/dev/null 2>&1; then
            echo "Installing hadolint..."
            EXPECTED_CHECKSUM="c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507"
            TMP_HADOLINT=$(mktemp)
            for i in {1..5}; do
              if sudo curl --connect-timeout 15 --retry 5 --retry-delay 5 -sSfL -o "$TMP_HADOLINT" https://github.com/hadolint/hadolint/releases/download/v2.15.1/hadolint-Linux-x86_64; then
                ACTUAL_CHECKSUM=$(sha256sum "$TMP_HADOLINT" | awk '{print $1}')
                if [ "$ACTUAL_CHECKSUM" != "$EXPECTED_CHECKSUM" ]; then
                  echo "::error::Hadolint SHA256 checksum mismatch! Expected: $EXPECTED_CHECKSUM, Got: $ACTUAL_CHECKSUM"
                  rm -f "$TMP_HADOLINT"
                  exit 1
                fi
                echo "Hadolint SHA256 checksum verified successfully."
                sudo mv "$TMP_HADOLINT" /usr/local/bin/hadolint
                sudo chmod +x /usr/local/bin/hadolint
                break
              else
                if [ "$i" -eq 5 ]; then
                  echo "::error::Failed to install hadolint after 5 attempts."
                  rm -f "$TMP_HADOLINT"
                  exit 1
                fi
                echo "Download failed, retrying in 5 seconds... (Attempt $i/5)"
                sleep 5
              fi
            done
          fi
          if command -v hadolint >/dev/null 2>&1; then
            mapfile -t DOCKERFILES < <(find . -type f -name Dockerfile)
            if [ ${#DOCKERFILES[@]} -gt 0 ] && [ -n "${DOCKERFILES[0]}" ]; then
              echo "Linting Dockerfiles:"
              printf '%s\n' "${DOCKERFILES[@]}"
              hadolint --failure-threshold error "${DOCKERFILES[@]}"
            else
              echo "No Dockerfiles found to lint."
            fi
          else
            echo "::error::Hadolint is not installed or unavailable."
            exit 1
          fi

      - name: Run ShellCheck on shell scripts
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            echo "Installing shellcheck..."
            if ! (sudo apt-get update && sudo apt-get install -y shellcheck); then
              echo "::error::Failed to install shellcheck."
              exit 1
            fi
          fi
          if command -v shellcheck >/dev/null 2>&1; then
            mapfile -t SHELL_SCRIPTS < <(find . -type f -name "*.sh" -not -path "*/.venv/*" -not -path "*/node_modules/*")
            if [ ${#SHELL_SCRIPTS[@]} -gt 0 ] && [ -n "${SHELL_SCRIPTS[0]}" ]; then
              echo "Linting shell scripts:"
              printf '%s\n' "${SHELL_SCRIPTS[@]}"
              shellcheck "${SHELL_SCRIPTS[@]}"
            else
              echo "No shell scripts found to lint."
            fi
          else
            echo "::error::ShellCheck is not installed or unavailable."
            exit 1
          fi

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            global.json

      - name: Run Markdown validation
        run: dotnet run --project packages/cli/src/Cadence.Cli.csproj -- check markdown

  dotnet-quality:
    name: .NET Quality & Sentinel Checks
    runs-on: ubuntu-latest
    env:
      RTM_DRAFT: "true"
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            global.json

      - name: Build .NET solution
        run: dotnet build Cadence.sln

      - name: Verify .NET C# code formatting (.editorconfig)
        run: dotnet format Cadence.sln --verify-no-changes --no-restore

      - name: Run Cadence quality sentinels
        run: dotnet run --no-build --project packages/cli/src/Cadence.Cli.csproj -- check

      - name: Run architecture tests
        run: dotnet test tests/Cadence.ArchitectureTests/Cadence.ArchitectureTests.csproj --no-build

      - name: Run hexagonal contract verification
        run: dotnet run --no-build --project packages/cli/src/Cadence.Cli.csproj -- check contracts

      - name: Run ADR validation
        run: dotnet run --no-build --project packages/cli/src/Cadence.Cli.csproj -- check adrs

      - name: Run CODEOWNERS coverage validation
        run: dotnet run --no-build --project packages/cli/src/Cadence.Cli.csproj -- validate-codeowners

      - name: Verify schema documentation freshness
        run: dotnet run --no-build --project packages/cli/src/Cadence.Cli.csproj -- check schema-doc

      - name: Verify OpenAPI specification drift
        run: dotnet run --no-build --project packages/cli/src/Cadence.Cli.csproj -- check openapi

      - name: Run requirements traceability validation
        run: dotnet run --no-build --project packages/cli/src/Cadence.Cli.csproj -- check rtm

      - name: Run code duplication verification
        run: |
          git fetch origin main --depth=1 || true
          CHANGED_FILES=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            CHANGED_FILES=$(git diff --name-only origin/main...HEAD 2>/dev/null | grep -E '\.(py|js|vue|css|cs)$' || true)
          else
            CHANGED_FILES=$(git diff --name-only HEAD~1..HEAD 2>/dev/null | grep -E '\.(py|js|vue|css|cs)$' || true)
          fi
          if [ -n "$CHANGED_FILES" ]; then
            mapfile -t FILES_ARRAY <<< "$CHANGED_FILES"
            dotnet run --no-build --project packages/cli/src/Cadence.Cli.csproj -- check duplication "${FILES_ARRAY[@]}"
          else
            # Fallback to scanning git status (staged/unstaged files)
            CHANGED_FILES=$(git status --porcelain | awk '{print $2}' | grep -E '\.(py|js|vue|css|cs)$' || true)
            if [ -n "$CHANGED_FILES" ]; then
              mapfile -t FILES_ARRAY <<< "$CHANGED_FILES"
              dotnet run --no-build --project packages/cli/src/Cadence.Cli.csproj -- check duplication "${FILES_ARRAY[@]}"
            else
              echo "No relevant files changed."
            fi
          fi

      - name: Upload Duplication Summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: duplication-summary
          path: duplication_summary.json

  native-aot-build:
    name: Native AOT Compilation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            global.json

      # Warnings are errors, so any trim or AOT warning (IL2xxx/IL3xxx) fails this step (#4794, ADR-2496).
      - name: Publish the CLI as Native AOT
        run: dotnet publish packages/cli/src/Cadence.Cli.csproj -c Release -r linux-x64 -o "$RUNNER_TEMP/cadence-cli"

  docs-build:
    name: Documentation Compilation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            global.json

      - name: Run documentation compilation
        env:
          CADENCE_DOCS_SKIP_CHECKS: "1"
        run: pnpm docs:build

  security:
    name: Security and Vulnerability Audit
    runs-on: ubuntu-latest
    env:
      UV_NO_SYNC: "1"
    permissions:
      contents: read
      security-events: write
    outputs:
      audit_outcome: ${{ steps.run_audit.outcome }}
      static_outcome: ${{ steps.run_static.outcome }}
      secrets_outcome: ${{ steps.run_secrets.outcome }}
      deid_outcome: ${{ steps.run_deid_scan.outcome }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            global.json

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Run static analysis
        id: run_static
        if: always()
        run: dotnet run --project packages/cli/src/Cadence.Cli.csproj -- check audit-security

      - name: Build container image for security scan
        if: github.event_name == 'push'
        run: |
          docker build -t cadence-gateway:latest -f docker/Dockerfile.dotnet --build-arg APP_NAME=gateway .

      - name: Run container vulnerability scan
        if: github.event_name == 'push'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "cadence-gateway:latest"
          format: "sarif"
          output: "trivy-results.sarif"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

      - name: Upload Trivy scan results to GitHub Security tab
        if: github.event_name == 'push' && (success() || failure())
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: "trivy-results.sarif"

      - name: Run dependency audit
        id: run_audit
        if: always()
        run: |
          python3 -m pip install --quiet --upgrade pip pip-audit==2.10.1 || true
          dotnet run --project packages/cli/src/Cadence.Cli.csproj -- check vulnerabilities

      - name: Run secret detection
        id: run_secrets
        if: always()
        run: |
          dotnet run --project packages/cli/src/Cadence.Cli.csproj -- check clean-secrets
          git diff --exit-code .secrets.baseline
          dotnet run --project packages/cli/src/Cadence.Cli.csproj -- check security

      - name: Run detect-secrets against the baseline
        id: run_detect_secrets
        if: always()
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: | # pragma: allowlist secret
          python3 -m pip install --quiet detect-secrets==1.5.0 || true
          export PATH="$HOME/.local/bin:$PATH"
          git fetch --no-tags origin "$BASE_REF" || true
          git diff --name-only --diff-filter=ACMR -z "origin/$BASE_REF...HEAD" \
            | xargs -0 --no-run-if-empty detect-secrets-hook --baseline .secrets.baseline --exclude-files '(pnpm-lock\.yaml|package-lock\.json|yarn\.lock)'

      - name: Run DEID compliance scan
        id: run_deid_scan
        if: always()
        run: |
          git fetch origin main --depth=1 || true
          CHANGED_FILES=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            CHANGED_FILES=$(git diff --name-only origin/main...HEAD 2>/dev/null | grep -E '\.(py|js|ts|tsx|jsx|json|md|log|txt|cs)$' || true)
          else
            CHANGED_FILES=$(git diff --name-only HEAD~1..HEAD 2>/dev/null | grep -E '\.(py|js|ts|tsx|jsx|json|md|log|txt|cs)$' || true)
          fi
          if [ -n "$CHANGED_FILES" ]; then
            echo "Scanning changed files: $CHANGED_FILES"
            mapfile -t DEID_FILES_ARRAY < <(printf '%s\n' "$CHANGED_FILES" | grep -v '^$')
            if [ ${#DEID_FILES_ARRAY[@]} -gt 0 ] && [ -n "${DEID_FILES_ARRAY[0]}" ]; then
              dotnet run --project packages/cli/src/Cadence.Cli.csproj -- check deid "${DEID_FILES_ARRAY[@]}"
            fi
          else
            echo "No changed files to scan."
          fi

  unit-tests:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      test_outcome: ${{ steps.run_tests.outcome }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            global.json

      - name: Build UI package
        run: pnpm --filter ui build

      - name: Run frontend unit tests
        id: run_tests
        if: always()
        run: pnpm -r test

  dotnet-tests:
    name: .NET 10 C# xUnit Verification
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      test_outcome: ${{ steps.run_dotnet_tests.outcome }}
    # tests/Cadence.IntegrationTests and tests/Cadence.E2ETests run against this database; without
    # CADENCE_TEST_POSTGRES they would be skipped (docs/TESTING.md).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cadence
          # A throwaway database on the runner; no credential is needed or stored.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: cadence
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cadence"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CADENCE_TEST_POSTGRES: Host=localhost;Port=5432;Database=cadence;Username=cadence
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            global.json

      - name: Restore NuGet Packages
        run: dotnet restore Cadence.sln

      - name: Build .NET 10 Solution
        run: dotnet build Cadence.sln --configuration Release --no-restore

      - name: Execute .NET 10 xUnit Test Suites
        id: run_dotnet_tests
        if: always()
        run: dotnet test Cadence.sln --configuration Release --no-build --logger "trx;LogFileName=report_dotnet.trx"

      - name: Upload .NET TRX Test Report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: trx-report-dotnet
          path: tests/**/TestResults/*.trx

  accessibility-e2e:
    name: Parallel E2E Accessibility Testing
    # Playwright browser installs are the most expensive job; run on main only.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright Browsers
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            echo "Playwright cache hit detected. Installing system dependencies and verifying browser binary..."
            pnpm exec playwright install-deps chromium
            pnpm exec playwright install chromium
          else
            echo "Playwright cache miss. Performing full browser installation..."
            for i in {1..3}; do
              if pnpm exec playwright install chromium --with-deps; then
                break
              else
                echo "Playwright install failed on attempt $i, retrying in 10s..."
                sleep 10
              fi
            done
          fi

      - name: Build UI package
        run: pnpm --filter ui build

      - name: Run Subject Portal E2E Accessibility Tests
        run: pnpm --filter subject-portal test:e2e

      - name: Run Web Application E2E Accessibility Tests
        run: pnpm --filter web test:e2e

  compliance:
    name: GxP Compliance & Qualification Reporting
    runs-on: ubuntu-latest
    needs: [unit-tests, dotnet-tests]
    if: always() && needs.unit-tests.outputs.test_outcome == 'success' && needs.dotnet-tests.outputs.test_outcome == 'success'
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            global.json

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Compliance Reports
        run: dotnet run --project packages/cli/src/Cadence.Cli.csproj -- gxp sync

      - name: Assert No Documentation Git Diff
        run: |
          echo "==== Comparing freshly generated reports against checked-in files ===="
          git diff docs/SDLC/Requirements_Traceability_Matrix.md docs/SDLC/IQ_OQ_PQ_Execution_Report.md
          git diff --exit-code docs/SDLC/Requirements_Traceability_Matrix.md docs/SDLC/IQ_OQ_PQ_Execution_Report.md || {
            echo "::error::GxP compliance documentation is out of sync with the current system state!"
            echo "::error::Please run 'dotnet run --project packages/cli/src/Cadence.Cli.csproj -- gxp sync' locally, and commit/push the updated files in 'docs/SDLC/'."
            exit 1
          }

  classify:
    name: Classify Change
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      is_safe: ${{ steps.classify.outputs.is_safe }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Fetch list of changed files
        id: classify
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request && github.event.pull_request.number || '0' }}/files --paginate --jq '.[] | .filename, (select(has("previous_filename")) | .previous_filename)' > changed_files.tmp
          sort -u changed_files.tmp > changed_files.txt
          cat changed_files.txt

          if [ ! -s changed_files.txt ]; then
            echo "No files changed."
            echo "is_safe=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          SAFE=true
          while IFS= read -r file; do
            if [[ "$file" == *"vulnerability_exclusions_ledger.json" ]] || [[ "$file" == *"validate_vulnerabilities"* ]]; then
              echo "Unsafe vulnerability/validation file: $file"
              SAFE=false
              break
            elif [[ "$file" == docs/* ]] || [[ "$file" == *.md ]]; then
              echo "Safe file: $file"
            else
              echo "Unsafe file: $file"
              SAFE=false
              break
            fi
          done < changed_files.txt

          echo "is_safe=$SAFE" >> "$GITHUB_OUTPUT"

      - name: Apply label
        if: steps.classify.outputs.is_safe == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "safe-change" --repo ${{ github.repository }} --color "0E8A16" --description "Safe non-GxP change" --force || true
          gh pr edit ${{ github.event.pull_request && github.event.pull_request.number || '0' }} --repo ${{ github.repository }} --add-label "safe-change" || echo "Failed to apply label. Ignoring."

  automerge:
    name: Enable Automerge
    needs:
      [classify, actionlint, lint-and-static, dotnet-quality, native-aot-build, docs-build, security, unit-tests, dotnet-tests, compliance]
    if: github.event_name == 'pull_request' && needs.classify.outputs.is_safe == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Enable Automerge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr merge "$PR_NUMBER" \
            --repo "${{ github.repository }}" \
            --auto \
            --squash || echo "::warning::Automerge enablement skipped or failed."

  release-and-archive:
    name: Call Production Pipeline
    needs: [dotnet-quality, security, compliance]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/production-pipeline.yml

  deploy-docs:
    name: Call Deploy Docs
    needs: [release-and-archive]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-docs.yml
