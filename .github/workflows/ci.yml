name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  style:
    name: Style and Lint Verification
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      linting_outcome: ${{ steps.run_linting.outcome }}
      frontend_outcome: ${{ steps.run_frontend.outcome }}
      adr_outcome: ${{ steps.run_adr.outcome }}
      duplication_outcome: ${{ steps.run_duplication.outcome }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend style and lint
        id: run_frontend
        if: always()
        run: pnpm -r format && pnpm -r lint

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Run markdown link verification
        id: run_link_check
        if: always()
        run: python3 scripts/validate_markdown.py

      - name: Run linting
        id: run_linting
        if: always()
        run: |
          uv run ruff check . --exclude apps/execution/database/models.py
          uv run ruff format --check . --exclude apps/execution/database/models.py

      - name: Run ADR validation
        id: run_adr
        if: always()
        run: python3 scripts/validate_adrs.py

      - name: Run code duplication verification
        id: run_duplication
        if: always()
        run: |
          git fetch origin main --depth=1 || true
          CHANGED_FILES=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            CHANGED_FILES=$(git diff --name-only origin/main...HEAD 2>/dev/null | grep -E '\.(py|js|vue|css)$' || true)
          else
            CHANGED_FILES=$(git diff --name-only HEAD~1..HEAD 2>/dev/null | grep -E '\.(py|js|vue|css)$' || true)
          fi
          if [ -n "$CHANGED_FILES" ]; then
            python3 scripts/detect_duplication.py $CHANGED_FILES
          else
            # Fallback to scanning git status (staged/unstaged files)
            CHANGED_FILES=$(git status --porcelain | awk '{print $2}' | grep -E '\.(py|js|vue|css)$' || true)
            if [ -n "$CHANGED_FILES" ]; then
              python3 scripts/detect_duplication.py $CHANGED_FILES
            else
              echo "No relevant files changed."
            fi
          fi

      - name: Upload Duplication Summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duplication-summary
          path: duplication_summary.json

  security:
    name: Security and Vulnerability Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      audit_outcome: ${{ steps.run_audit.outcome }}
      static_outcome: ${{ steps.run_static.outcome }}
      secrets_outcome: ${{ steps.run_secrets.outcome }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Cache pre-commit
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Run static analysis
        id: run_static
        if: always()
        run: uv run bandit -c pyproject.toml -ll -ii -r apps packages

      - name: Run dependency audit
        id: run_audit
        if: always()
        run: python3 scripts/validate_vulnerabilities.py

      - name: Run secret detection
        id: run_secrets
        if: always()
        run: |
          git add .secrets.baseline
          uv run pre-commit run detect-secrets --all-files

  unit-tests:
    name: Frontend & Backend Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: cadence
          POSTGRES_PASSWORD: cadence_password
          POSTGRES_DB: cadence_edc
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    outputs:
      test_outcome: ${{ steps.run_tests.outcome }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend unit tests
        run: pnpm -r test

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Run backend unit tests and coverage
        id: run_tests
        if: always()
        env:
          TEST_DATABASE_URL: "postgresql+asyncpg://cadence:cadence_password@localhost:5432/cadence_edc"
        run: uv run pytest -n auto --cov=apps --cov=packages --cov-fail-under=80 --ignore=tests/test_layout_validator.py --junitxml=report-unit.xml

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-report-unit
          path: report-unit.xml

  integration-tests:
    name: Playwright Integration Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: cadence
          POSTGRES_PASSWORD: cadence_password
          POSTGRES_DB: cadence_edc
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    outputs:
      test_outcome: ${{ steps.run_tests.outcome }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright Browsers
        run: |
          for i in {1..3}; do
            uv run playwright install chromium --with-deps && break || {
              echo "Playwright install failed on attempt $i, retrying in 10s..."
              sleep 10
            }
          done

      - name: Run backend integration tests
        id: run_tests
        if: always()
        env:
          TEST_DATABASE_URL: "postgresql+asyncpg://cadence:cadence_password@localhost:5432/cadence_edc"
        run: uv run pytest -n auto tests/test_layout_validator.py --no-cov --junitxml=report-integration.xml

      - name: Upload integration test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-report-integration
          path: report-integration.xml

  qualification-tests:
    name: Isolated GxP Qualification Suite
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: cadence
          POSTGRES_PASSWORD: cadence_password
          POSTGRES_DB: cadence_edc
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    outputs:
      test_outcome: ${{ steps.run_tests.outcome }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Run GxP qualification validation suite
        id: run_tests
        if: always()
        run: uv run pytest tests/validation -o "python_files=*_suite.py *_tests.py" --no-cov --junitxml=report-qualification.xml

      - name: Upload qualification test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-report-qualification
          path: report-qualification.xml

  compliance:
    name: GxP Compliance & Qualification Reporting
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, qualification-tests]
    if: always() && needs.unit-tests.outputs.test_outcome == 'success' && needs.integration-tests.outputs.test_outcome == 'success' && needs.qualification-tests.outputs.test_outcome == 'success'
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Download Unit Test Report
        uses: actions/download-artifact@v4
        with:
          name: junit-report-unit
          path: .

      - name: Download Integration Test Report
        uses: actions/download-artifact@v4
        with:
          name: junit-report-integration
          path: .

      - name: Download Qualification Test Report
        uses: actions/download-artifact@v4
        with:
          name: junit-report-qualification
          path: .

      - name: Merge JUnit XML Reports
        run: python3 scripts/merge_junit.py report.xml report-unit.xml report-integration.xml report-qualification.xml

      - name: Generate Compliance Reports
        run: uv run python scripts/generate_rtm.py

      - name: Assert No Documentation Git Diff
        run: |
          echo "==== Comparing freshly generated reports against checked-in files ===="
          git diff --exit-code docs/SDLC/Requirements_Traceability_Matrix.md docs/SDLC/IQ_OQ_PQ_Execution_Report.md || {
            echo "::error::GxP compliance documentation is out of sync with the current system state!"
            echo "::error::Please run 'uv run pytest --junitxml=report.xml' followed by 'python scripts/generate_rtm.py' locally, and commit/push the updated files in 'docs/SDLC/'."
            exit 1
          }

  comment:
    name: Post PR Quality Checklist Comment
    if: always() && github.event_name == 'pull_request'
    needs: [style, security, unit-tests, integration-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Download Duplication Summary
        if: always()
        uses: actions/download-artifact@v4
        with:
          name: duplication-summary
          path: .
          ignore-on-missing: true

      - name: Post PR Comment
        env:
          GH_TOKEN: ${{ secrets.PAT_FDERUITER || secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          LINTING_OUTCOME: ${{ needs.style.outputs.linting_outcome }}
          TEST_OUTCOME: ${{ (needs.unit-tests.outputs.test_outcome == 'success' && needs.integration-tests.outputs.test_outcome == 'success') && 'success' || 'failure' }}
          FRONTEND_OUTCOME: ${{ needs.style.outputs.frontend_outcome }}
          ADR_OUTCOME: ${{ needs.style.outputs.adr_outcome }}
          AUDIT_OUTCOME: ${{ needs.security.outputs.audit_outcome }}
          STATIC_OUTCOME: ${{ needs.security.outputs.static_outcome }}
          SECRETS_OUTCOME: ${{ needs.security.outputs.secrets_outcome }}
          DUPLICATION_OUTCOME: ${{ needs.style.outputs.duplication_outcome }}
        run: python3 scripts/post_pr_comment.py
  classify:
    name: Classify Change
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      is_safe: ${{ steps.classify.outputs.is_safe }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Fetch list of changed files
        id: classify
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request && github.event.pull_request.number || '0' }}/files --paginate --jq '.[] | .filename, (select(has("previous_filename")) | .previous_filename)' > changed_files.tmp
          sort -u changed_files.tmp > changed_files.txt
          cat changed_files.txt

          if [ ! -s changed_files.txt ]; then
            echo "No files changed."
            echo "is_safe=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          SAFE=true
          while IFS= read -r file; do
            if [[ "$file" == docs/* ]] || [[ "$file" == *.md ]] || [[ "$file" == tests/* ]] || [[ "$file" == *.sh ]] || [[ "$file" == scripts/* ]]; then
              echo "Safe file: $file"
            else
              echo "Unsafe file: $file"
              SAFE=false
              break
            fi
          done < changed_files.txt

          echo "is_safe=$SAFE" >> $GITHUB_OUTPUT

      - name: Apply label
        if: steps.classify.outputs.is_safe == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "safe-change" --repo ${{ github.repository }} --color "0E8A16" --description "Safe non-GxP change" --force || true
          gh pr edit ${{ github.event.pull_request && github.event.pull_request.number || '0' }} --repo ${{ github.repository }} --add-label "safe-change" || echo "Failed to apply label. Ignoring."

  automerge:
    name: Approve and Automerge
    needs: [classify, style, security, unit-tests, integration-tests, compliance]
    if: github.event_name == 'pull_request' && needs.classify.outputs.is_safe == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Approve Pull Request
        env:
          GH_TOKEN: ${{ secrets.SERVICE_ACCOUNT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          gh pr review ${{ github.event.pull_request && github.event.pull_request.number || '0' }} --repo ${{ github.repository }} --approve --body "Programmatic approval: Verified safe non-GxP change." || echo "Programmatic approval failed or not permitted."

      - name: Enable Automerge
        env:
          GH_TOKEN: ${{ secrets.SERVICE_ACCOUNT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge ${{ github.event.pull_request && github.event.pull_request.number || '0' }} --repo ${{ github.repository }} --auto --squash || echo "Automerge enablement failed or not permitted."

  sync-ruleset:
    name: Sync Branch Ruleset
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Sync Ruleset
        env:
          GH_TOKEN: ${{ secrets.SERVICE_ACCOUNT_TOKEN || secrets.PAT_FDERUITER || secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/sync_ruleset.py
