name: CI

on:
  push:
    branches: [main, release/*]
    tags: ["v*"]
  pull_request:
    branches: [main, release/*]
  merge_group:
    branches: [main, release/*]
  workflow_dispatch:
    inputs:
      target:
        description: "Downstream workflow caller to run after all 11 CI gates succeed on main, release/*, or v*"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - release-and-archive
          - deploy-docs
          - validate-only

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  actionlint:
    name: Workflow Action Pinning & Actionlint Gate
    if: >-
      github.event_name != 'workflow_dispatch' ||
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/heads/release/') ||
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run actionlint
        uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12

  lint-and-static:
    name: Lint and Static Verification
    needs: [native-aot-build]
    if: >-
      github.event_name != 'workflow_dispatch' ||
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/heads/release/') ||
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend workspace
        run: pnpm build

      - name: Run frontend style and lint
        run: |
          pnpm exec prettier --check --ignore-path .prettierignore "**/*.{js,jsx,ts,tsx,mjs,cjs,vue,json,css,md,yaml,yml}"
          pnpm -r lint
          pnpm exec eslint --max-warnings 0 .
          pnpm -r typecheck

      - name: Run Hadolint on Dockerfiles
        run: |
          if ! command -v hadolint >/dev/null 2>&1; then
            echo "Installing hadolint..."
            EXPECTED_CHECKSUM="c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507"
            TMP_HADOLINT=$(mktemp)
            for i in {1..5}; do
              if sudo curl --connect-timeout 15 --retry 5 --retry-delay 5 -sSfL -o "$TMP_HADOLINT" https://github.com/hadolint/hadolint/releases/download/v2.15.1/hadolint-Linux-x86_64; then
                ACTUAL_CHECKSUM=$(sha256sum "$TMP_HADOLINT" | awk '{print $1}')
                if [ "$ACTUAL_CHECKSUM" != "$EXPECTED_CHECKSUM" ]; then
                  echo "::error::Hadolint SHA256 checksum mismatch! Expected: $EXPECTED_CHECKSUM, Got: $ACTUAL_CHECKSUM"
                  rm -f "$TMP_HADOLINT"
                  exit 1
                fi
                echo "Hadolint SHA256 checksum verified successfully."
                sudo mv "$TMP_HADOLINT" /usr/local/bin/hadolint
                sudo chmod +x /usr/local/bin/hadolint
                break
              else
                if [ "$i" -eq 5 ]; then
                  echo "::error::Failed to install hadolint after 5 attempts."
                  rm -f "$TMP_HADOLINT"
                  exit 1
                fi
                echo "Download failed, retrying in 5 seconds... (Attempt $i/5)"
                sleep 5
              fi
            done
          fi
          if command -v hadolint >/dev/null 2>&1; then
            mapfile -t DOCKERFILES < <(find . -type f -name "Dockerfile*" -not -path "*/.venv/*" -not -path "*/.cadence/*" -not -path "*/node_modules/*")
            if [ ${#DOCKERFILES[@]} -gt 0 ] && [ -n "${DOCKERFILES[0]}" ]; then
              echo "Linting Dockerfiles:"
              printf '%s\n' "${DOCKERFILES[@]}"
              hadolint --failure-threshold error "${DOCKERFILES[@]}"
            else
              echo "No Dockerfiles found to lint."
            fi
          else
            echo "::error::Hadolint is not installed or unavailable."
            exit 1
          fi

      - name: Run ShellCheck on shell scripts
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            echo "Installing shellcheck..."
            if ! (sudo apt-get update && sudo apt-get install -y shellcheck); then
              echo "::error::Failed to install shellcheck."
              exit 1
            fi
          fi
          if command -v shellcheck >/dev/null 2>&1; then
            mapfile -t SHELL_SCRIPTS < <(find . -type f -name "*.sh" -not -path "*/.venv/*" -not -path "*/.cadence/*" -not -path "*/node_modules/*")
            if [ ${#SHELL_SCRIPTS[@]} -gt 0 ] && [ -n "${SHELL_SCRIPTS[0]}" ]; then
              echo "Linting shell scripts:"
              printf '%s\n' "${SHELL_SCRIPTS[@]}"
              shellcheck "${SHELL_SCRIPTS[@]}"
            else
              echo "No shell scripts found to lint."
            fi
          else
            echo "::error::ShellCheck is not installed or unavailable."
            exit 1
          fi

      - name: Run installer checksum tests
        run: bash tests/test_installer_checksums.sh

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            global.json
            Directory.Build.props
            Directory.Build.targets
            Directory.Packages.props
            NuGet.Config
            **/*.csproj

      - name: Download Cadence CLI Artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cadence-cli-${{ github.run_id }}-${{ github.run_attempt }}
          path: ./bin

      - name: Run Markdown validation
        run: node scripts/run-cli.js check markdown

      - name: Validate web API clients against OpenAPI types
        run: node scripts/run-cli.js check api-clients

  dotnet-quality:
    name: .NET Quality & Sentinel Checks
    if: >-
      github.event_name != 'workflow_dispatch' ||
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/heads/release/') ||
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      RTM_DRAFT: "true"
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            global.json
            Directory.Build.props
            Directory.Build.targets
            Directory.Packages.props
            NuGet.Config
            **/*.csproj

      - name: Build .NET solution
        run: dotnet build Cadence.sln

      - name: Run Cadence quality sentinels
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref || github.event.merge_group.base_ref || 'main' }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          echo "Scoping quality sentinels at ${HEAD_SHA} (event=${EVENT_NAME})"
          if [ "$EVENT_NAME" = "pull_request" ] || [ "$EVENT_NAME" = "merge_group" ]; then
            BASE_BRANCH="${BASE_REF#refs/heads/}"
            git fetch --no-tags origin "$BASE_BRANCH"
            SCOPE_ARGS=(--base "origin/$BASE_BRANCH")
          elif [ -n "$BEFORE_SHA" ]; then
            SCOPE_ARGS=(--push-before "$BEFORE_SHA")
          else
            SCOPE_ARGS=()
          fi
          dotnet run --no-build --project packages/cli/src/Cadence.Cli.csproj -- check --exclude prettier --exclude eslint --exclude typecheck --exclude actionlint --exclude hadolint --exclude detect-secrets --exclude api-clients --exclude vulnerabilities --exclude public-bundle --exclude architecture-tests --exclude unit-tests "${SCOPE_ARGS[@]}"

      - name: Run architecture tests
        run: dotnet test tests/Cadence.ArchitectureTests/Cadence.ArchitectureTests.csproj --no-build

      - name: Upload Duplication Summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: duplication-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: duplication_summary.json
          retention-days: 400

  native-aot-build:
    name: Native AOT Compilation
    if: >-
      github.event_name != 'workflow_dispatch' ||
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/heads/release/') ||
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            global.json
            Directory.Build.props
            Directory.Build.targets
            Directory.Packages.props
            NuGet.Config
            **/*.csproj

      - name: Cache Cadence CLI
        id: cadence-cli-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ./bin/cadence
          key: cadence-cli-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.Build.props', 'Directory.Build.targets', 'Directory.Packages.props', 'NuGet.Config', 'BannedSymbols.txt', 'packages/cli/src/**', 'packages/engine_core/src/**', 'packages/database/src/**', 'packages/compliance/src/**', 'packages/security/src/**', 'packages/tooling_core/src/**', 'packages/kernel/src/Cadence.Kernel.Abstractions/**', 'packages/deid/src/**', 'packages/topology/src/**') }}

      # Warnings are errors, so any trim or AOT warning (IL2xxx/IL3xxx) fails this step (#4794, ADR-2496).
      - name: Publish the CLI as Native AOT
        if: steps.cadence-cli-cache.outputs.cache-hit != 'true'
        run: dotnet publish packages/cli/src/Cadence.Cli.csproj -c Release -r linux-x64 -o ./bin

      - name: Upload Cadence CLI Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cadence-cli-${{ github.run_id }}-${{ github.run_attempt }}
          path: ./bin/cadence
          if-no-files-found: error
          retention-days: 400

  docs-build:
    name: Documentation Compilation
    needs: [native-aot-build]
    if: >-
      github.event_name != 'workflow_dispatch' ||
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/heads/release/') ||
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            global.json
            Directory.Build.props
            Directory.Build.targets
            Directory.Packages.props
            NuGet.Config
            **/*.csproj

      - name: Download Cadence CLI Artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cadence-cli-${{ github.run_id }}-${{ github.run_attempt }}
          path: ./bin

      - name: Build UI package
        run: pnpm --filter ui build

      - name: Run documentation compilation
        run: pnpm docs:build

      - name: Build and stage co-hosted interactive demos
        run: pnpm docs:stage-demos

      - name: Verify public bundles
        run: node scripts/run-cli.js check public-bundle

  security:
    name: Security and Vulnerability Audit
    needs: [native-aot-build]
    if: >-
      github.event_name != 'workflow_dispatch' ||
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/heads/release/') ||
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      UV_NO_SYNC: "1"
    permissions:
      contents: read
    outputs:
      audit_outcome: ${{ steps.run_audit.outcome }}
      static_outcome: ${{ steps.run_static.outcome }}
      secrets_outcome: ${{ steps.run_secrets.outcome }}
      detect_secrets_outcome: ${{ steps.run_detect_secrets.outcome }}
      deid_outcome: ${{ steps.run_deid_scan.outcome }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            global.json
            Directory.Build.props
            Directory.Build.targets
            Directory.Packages.props
            NuGet.Config
            **/*.csproj

      - name: Download Cadence CLI Artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cadence-cli-${{ github.run_id }}-${{ github.run_attempt }}
          path: ./bin

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"

      - name: Run static analysis
        id: run_static
        if: always()
        run: node scripts/run-cli.js check audit-security

      - name: Run dependency audit
        id: run_audit
        if: always()
        run: |
          dotnet restore Cadence.sln
          python3 -m venv "$RUNNER_TEMP/pip-audit-venv"
          "$RUNNER_TEMP/pip-audit-venv/bin/python" -m pip install --quiet --upgrade pip pip-audit==2.10.1
          export PATH="$RUNNER_TEMP/pip-audit-venv/bin:$PATH"
          node scripts/run-cli.js check vulnerabilities

      - name: Run secret detection
        id: run_secrets
        if: always()
        run: |
          node scripts/run-cli.js check clean-secrets
          node scripts/run-cli.js check security

      - name: Run detect-secrets against the baseline
        id: run_detect_secrets
        if: always()
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref || github.event.merge_group.base_ref || 'main' }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: | # pragma: allowlist secret
          echo "Scoping detect-secrets scan at ${HEAD_SHA} (event=${EVENT_NAME})"
          python3 -m venv "$RUNNER_TEMP/detect-secrets-venv"
          "$RUNNER_TEMP/detect-secrets-venv/bin/python" -m pip install --quiet --upgrade pip detect-secrets==1.5.0
          export PATH="$RUNNER_TEMP/detect-secrets-venv/bin:$PATH"
          if [ "$EVENT_NAME" = "pull_request" ] || [ "$EVENT_NAME" = "merge_group" ]; then
            BASE_BRANCH="${BASE_REF#refs/heads/}"
            git fetch --no-tags origin "$BASE_BRANCH"
            SCOPE_ARGS=(--base "origin/$BASE_BRANCH")
          elif [ -n "$BEFORE_SHA" ]; then
            SCOPE_ARGS=(--push-before "$BEFORE_SHA")
          else
            SCOPE_ARGS=()
          fi
          node scripts/run-cli.js check detect-secrets "${SCOPE_ARGS[@]}"

      - name: Run DEID compliance scan
        id: run_deid_scan
        if: always()
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref || github.event.merge_group.base_ref || 'main' }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          echo "Scoping DEID compliance scan at ${HEAD_SHA} (event=${EVENT_NAME})"
          if [ "$EVENT_NAME" = "pull_request" ] || [ "$EVENT_NAME" = "merge_group" ]; then
            BASE_BRANCH="${BASE_REF#refs/heads/}"
            git fetch --no-tags origin "$BASE_BRANCH"
            SCOPE_ARGS=(--base "origin/$BASE_BRANCH")
          elif [ -n "$BEFORE_SHA" ]; then
            SCOPE_ARGS=(--push-before "$BEFORE_SHA")
          else
            SCOPE_ARGS=()
          fi
          node scripts/run-cli.js check deid "${SCOPE_ARGS[@]}"

  container-security:
    name: Container Build & Vulnerability Scan
    needs: [classify]
    if: >-
      always() && !cancelled() && (
        github.event_name == 'push' ||
        github.event_name == 'merge_group' ||
        (github.event_name == 'workflow_dispatch' && (
          github.ref == 'refs/heads/main' ||
          startsWith(github.ref, 'refs/heads/release/') ||
          startsWith(github.ref, 'refs/tags/v')
        )) ||
        (github.event_name == 'pull_request' && (
          needs.classify.outputs.container_scan == 'true' ||
          github.actor == 'dependabot[bot]' ||
          contains(github.event.pull_request.labels.*.name, 'dependencies')
        ))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: gateway
            context: .
            dockerfile: docker/Dockerfile.dotnet
            app_name: gateway
            build_target: runtime
          - target: designer
            context: .
            dockerfile: docker/Dockerfile.dotnet
            app_name: designer
            build_target: runtime
          - target: execution
            context: .
            dockerfile: docker/Dockerfile.dotnet
            app_name: execution
            build_target: runtime
          - target: etmf
            context: .
            dockerfile: docker/Dockerfile.dotnet
            app_name: etmf
            build_target: runtime
          - target: interop
            context: .
            dockerfile: docker/Dockerfile.dotnet
            app_name: interop
            build_target: runtime
          - target: quality
            context: .
            dockerfile: docker/Dockerfile.dotnet
            app_name: quality
            build_target: runtime
          - target: notifications
            context: .
            dockerfile: docker/Dockerfile.dotnet
            app_name: notifications
            build_target: runtime
          - target: ctms
            context: .
            dockerfile: docker/Dockerfile.dotnet
            app_name: ctms
            build_target: runtime
          - target: safety
            context: .
            dockerfile: docker/Dockerfile.dotnet
            app_name: safety
            build_target: runtime
          - target: tickets
            context: .
            dockerfile: docker/Dockerfile.dotnet
            app_name: tickets
            build_target: runtime
          - target: eisf
            context: .
            dockerfile: docker/Dockerfile.dotnet
            app_name: eisf
            build_target: runtime
          - target: econsent
            context: .
            dockerfile: docker/Dockerfile.dotnet
            app_name: econsent
            build_target: runtime
          - target: org
            context: .
            dockerfile: docker/Dockerfile.dotnet
            app_name: org
            build_target: runtime
          - target: fileshare
            context: .
            dockerfile: docker/Dockerfile.dotnet
            app_name: fileshare
            build_target: runtime
          - target: imaging
            context: .
            dockerfile: docker/Dockerfile.dotnet
            app_name: imaging
            build_target: runtime
          - target: knowledge
            context: .
            dockerfile: docker/Dockerfile.dotnet
            app_name: knowledge
            build_target: runtime
          - target: payments
            context: .
            dockerfile: docker/Dockerfile.dotnet
            app_name: payments
            build_target: runtime
          - target: kernel-api
            context: .
            dockerfile: docker/Dockerfile.dotnet
            app_name: kernel-api
            build_target: runtime
          - target: sce-python
            context: docker/sce/python
            dockerfile: docker/sce/python/Dockerfile
            app_name: ""
            build_target: ""
          - target: sce-r
            context: docker/sce/r
            dockerfile: docker/sce/r/Dockerfile
            app_name: ""
            build_target: ""
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate Docker Compose configuration
        run: docker compose -f docker/docker-compose.yml config -q

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build container image for security scan
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.build_target }}
          build-args: |
            APP_NAME=${{ matrix.app_name }}
            VERSION=${{ github.ref_name || 'dev' }}
            VCS_REF=${{ github.sha }}
          tags: cadence-${{ matrix.target }}:latest
          load: true
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run container vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "cadence-${{ matrix.target }}:latest"
          format: "sarif"
          output: "trivy-results-${{ matrix.target }}.sarif"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

      - name: Upload Trivy scan results to GitHub Security tab
        if: (success() || failure()) && (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: "trivy-results-${{ matrix.target }}.sarif"
          category: "trivy-${{ matrix.target }}"

  unit-tests:
    name: Frontend Unit Tests
    if: >-
      github.event_name != 'workflow_dispatch' ||
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/heads/release/') ||
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      test_outcome: ${{ steps.run_tests.outcome }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Build UI package
        run: pnpm --filter ui build

      - name: Run frontend unit tests
        id: run_tests
        if: always()
        run: |
          pnpm -r test
          pnpm exec vitest run --config vitest.config.mjs

  dotnet-tests:
    name: .NET 10 C# xUnit Verification
    if: >-
      github.event_name != 'workflow_dispatch' ||
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/heads/release/') ||
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      test_outcome: ${{ steps.run_dotnet_tests.outcome == 'success' && steps.database_test_gate.outcome == 'success' && steps.upload_gxp_evidence.outcome == 'success' && 'success' || 'failure' }}
    # tests/Cadence.IntegrationTests and tests/Cadence.E2ETests run against this database; without
    # CADENCE_TEST_POSTGRES they would be skipped (docs/TESTING.md).
    services:
      postgres:
        # The image the tests qualify: PostgresTestImage.Image and docker/docker-compose.yml (ADR-2533).
        image: postgres:18-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
        env:
          POSTGRES_USER: cadence
          # A throwaway database on the runner; no credential is needed or stored.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: cadence
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cadence"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CADENCE_TEST_POSTGRES: Host=localhost;Port=5432;Database=cadence;Username=cadence
      CADENCE_TEST_EVIDENCE_DIR: ${{ github.workspace }}/TestResults/gxp
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            global.json
            Directory.Build.props
            Directory.Build.targets
            Directory.Packages.props
            NuGet.Config
            **/*.csproj

      - name: Restore NuGet Packages
        run: dotnet restore Cadence.sln

      - name: Build .NET 10 Solution
        run: dotnet build Cadence.sln --configuration Release --no-restore

      - name: Execute .NET 10 xUnit Test Suites
        id: run_dotnet_tests
        if: always()
        run: dotnet test Cadence.sln --configuration Release --no-build --results-directory TestResults/gxp --logger "trx;LogFilePrefix=gxp"

      - name: Upload .NET TRX Test Report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: trx-report-dotnet-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            TestResults/gxp/*.trx
            TestResults/gxp/*.database.txt
          retention-days: 400

      # A database test that did not execute is skipped, not passed: the fixtures report it as NotExecuted when
      # CADENCE_TEST_POSTGRES is missing (#5325). test_outcome above waits on this step, so the compliance job is
      # blocked too. NOT YET VERIFIED BY A CI RUN: Actions is out of minutes (#5685).
      - name: Fail the run when a PostgreSQL test did not execute
        id: database_test_gate
        if: steps.run_dotnet_tests.outcome == 'success'
        run: |
          bash scripts/test-check-database-test-results.sh
          bash scripts/check-database-test-results.sh

      - name: Upload Verified GxP Test Evidence
        id: upload_gxp_evidence
        if: steps.database_test_gate.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: gxp-test-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: TestResults/gxp
          if-no-files-found: error
          retention-days: 400

  accessibility-e2e:
    name: Parallel E2E Accessibility Testing
    if: >-
      github.event_name != 'workflow_dispatch' ||
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/heads/release/') ||
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        # BrowserCorrectionReachesTheDatabaseWithItsReason verifies browser-to-PostgreSQL 18 observation corrections (ADR-2533, ADR-2620).
        image: postgres:18-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
        env:
          POSTGRES_USER: cadence
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: cadence
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cadence"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CADENCE_TEST_POSTGRES: Host=localhost;Port=5432;Database=cadence;Username=cadence
      CADENCE_TEST_BROWSER: "1"
      CADENCE_TEST_EVIDENCE_DIR: ${{ github.workspace }}/TestResults/gxp-browser
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright Browsers
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            echo "Playwright cache hit detected. Installing system dependencies and verifying browser binary..."
            pnpm --filter web exec playwright install-deps chromium
            pnpm --filter web exec playwright install chromium
          else
            echo "Playwright cache miss. Performing full browser installation..."
            for i in {1..3}; do
              if pnpm --filter web exec playwright install chromium --with-deps; then
                break
              else
                if [ "$i" -eq 3 ]; then
                  echo "::error::Failed to install Playwright browsers after 3 attempts."
                  exit 1
                fi
                echo "Playwright install failed on attempt $i, retrying in 10s..."
                sleep 10
              fi
            done
          fi

      - name: Build UI package
        run: pnpm --filter ui build

      - name: Run Subject Portal E2E Accessibility Tests
        run: pnpm --filter subject-portal test:e2e

      - name: Run Web Application E2E Accessibility Tests
        run: pnpm --filter web test:e2e

      - name: Run Web Application E2E Workflow Tests
        env:
          DEMO_MODE: "false"
        run: pnpm --filter web test:e2e:workflows

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            global.json
            Directory.Build.props
            Directory.Build.targets
            Directory.Packages.props
            NuGet.Config
            **/*.csproj

      - name: Run Browser-to-Database Correction Integration Test
        id: run_browser_correction_test
        run: dotnet test tests/Cadence.IntegrationTests/Cadence.IntegrationTests.csproj --configuration Release --filter FullyQualifiedName~BrowserCorrectionReachesTheDatabaseWithItsReason --results-directory TestResults/gxp-browser --logger "trx;LogFilePrefix=gxp_browser"

      - name: Upload Browser TRX Test Report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: trx-report-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            TestResults/gxp-browser/*.trx
            TestResults/gxp-browser/*.database.txt
          retention-days: 400

      - name: Upload Verified Browser GxP Test Evidence
        if: steps.run_browser_correction_test.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: gxp-browser-test-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: TestResults/gxp-browser
          if-no-files-found: error
          retention-days: 400

  compliance:
    name: GxP Compliance & Qualification Reporting
    runs-on: ubuntu-latest
    needs: [native-aot-build, unit-tests, dotnet-tests]
    if: >-
      always() &&
      (
        github.event_name != 'workflow_dispatch' ||
        github.ref == 'refs/heads/main' ||
        startsWith(github.ref, 'refs/heads/release/') ||
        startsWith(github.ref, 'refs/tags/v')
      ) &&
      needs.native-aot-build.result == 'success' &&
      needs.unit-tests.outputs.test_outcome == 'success' &&
      needs.dotnet-tests.outputs.test_outcome == 'success'
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            global.json
            Directory.Build.props
            Directory.Build.targets
            Directory.Packages.props
            NuGet.Config
            **/*.csproj

      - name: Download Cadence CLI Artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cadence-cli-${{ github.run_id }}-${{ github.run_attempt }}
          path: ./bin

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Download .NET Test Evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gxp-test-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: TestResults/gxp

      - name: Generate Compliance Reports
        # A feature branch validates its requirement tags and results and writes a preview; it never changes the
        # committed snapshot (ADR-2532). Snapshot PRs from the integration owner set CADENCE_GXP_SNAPSHOT=1.
        run: node scripts/run-cli.js gxp sync --results-dir TestResults/gxp

      - name: Check GxP Snapshot Policy
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref || github.event.merge_group.base_ref || 'main' }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          echo "Scoping GxP snapshot policy check at ${HEAD_SHA} (event=${EVENT_NAME})"
          if [ "$EVENT_NAME" = "pull_request" ] || [ "$EVENT_NAME" = "merge_group" ]; then
            BASE_BRANCH="${BASE_REF#refs/heads/}"
            git fetch --no-tags origin "$BASE_BRANCH"
            SCOPE_ARGS=(--base "origin/$BASE_BRANCH")
          elif [ -n "$BEFORE_SHA" ]; then
            SCOPE_ARGS=(--push-before "$BEFORE_SHA")
          else
            SCOPE_ARGS=()
          fi
          node scripts/run-cli.js check gxp-snapshot "${SCOPE_ARGS[@]}"

  ci-gate:
    name: CI Gate
    needs:
      [
        actionlint,
        lint-and-static,
        dotnet-quality,
        native-aot-build,
        docs-build,
        security,
        container-security,
        unit-tests,
        dotnet-tests,
        accessibility-e2e,
        compliance,
      ]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Verify validation job outcomes
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref }}
          DISPATCH_TARGET: ${{ inputs.target }}
          ACTIONLINT_RESULT: ${{ needs.actionlint.result }}
          LINT_AND_STATIC_RESULT: ${{ needs.lint-and-static.result }}
          DOTNET_QUALITY_RESULT: ${{ needs.dotnet-quality.result }}
          NATIVE_AOT_BUILD_RESULT: ${{ needs.native-aot-build.result }}
          DOCS_BUILD_RESULT: ${{ needs.docs-build.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          CONTAINER_SECURITY_RESULT: ${{ needs.container-security.result }}
          UNIT_TESTS_RESULT: ${{ needs.unit-tests.result }}
          DOTNET_TESTS_RESULT: ${{ needs.dotnet-tests.result }}
          ACCESSIBILITY_E2E_RESULT: ${{ needs.accessibility-e2e.result }}
          COMPLIANCE_RESULT: ${{ needs.compliance.result }}
        run: |
          set -euo pipefail
          FAILED=0

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Manual dispatch requested for target='${DISPATCH_TARGET:-all}' on ref='${REF_NAME}'"
            case "$REF_NAME" in
              refs/heads/main|refs/heads/release/*|refs/tags/v*) ;;
              *)
                echo "::error::Manual workflow_dispatch is restricted to refs/heads/main, refs/heads/release/*, and refs/tags/v* (got '$REF_NAME')."
                exit 1
                ;;
            esac
          fi

          check_required() {
            local job="$1"
            local result="$2"
            echo "$job: $result"
            if [ "$result" != "success" ]; then
              echo "::error::Required validation job '$job' did not succeed (result: $result)."
              FAILED=1
            fi
          }

          check_required "actionlint" "$ACTIONLINT_RESULT"
          check_required "lint-and-static" "$LINT_AND_STATIC_RESULT"
          check_required "dotnet-quality" "$DOTNET_QUALITY_RESULT"
          check_required "native-aot-build" "$NATIVE_AOT_BUILD_RESULT"
          check_required "docs-build" "$DOCS_BUILD_RESULT"
          check_required "security" "$SECURITY_RESULT"
          check_required "unit-tests" "$UNIT_TESTS_RESULT"
          check_required "dotnet-tests" "$DOTNET_TESTS_RESULT"
          check_required "accessibility-e2e" "$ACCESSIBILITY_E2E_RESULT"
          check_required "compliance" "$COMPLIANCE_RESULT"

          echo "container-security: $CONTAINER_SECURITY_RESULT"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            if [ "$CONTAINER_SECURITY_RESULT" != "success" ] && [ "$CONTAINER_SECURITY_RESULT" != "skipped" ]; then
              echo "::error::Conditional validation job 'container-security' failed or cancelled (result: $CONTAINER_SECURITY_RESULT)."
              FAILED=1
            fi
          elif [ "$CONTAINER_SECURITY_RESULT" != "success" ]; then
            echo "::error::Validation job 'container-security' did not succeed on $EVENT_NAME (result: $CONTAINER_SECURITY_RESULT)."
            FAILED=1
          fi

          if [ "$FAILED" -ne 0 ]; then
            exit 1
          fi

  classify:
    name: Classify Change
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      is_safe: ${{ steps.classify.outputs.is_safe }}
      container_scan: ${{ steps.classify.outputs.container_scan }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Fetch list of changed files
        id: classify
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request && github.event.pull_request.number || '0' }}/files --paginate --jq '.[] | .filename, (select(has("previous_filename")) | .previous_filename)' > changed_files.tmp
          sort -u changed_files.tmp > changed_files.txt
          cat changed_files.txt

          if [ ! -s changed_files.txt ]; then
            echo "No files changed."
            echo "is_safe=false" >> "$GITHUB_OUTPUT"
            echo "container_scan=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          SAFE=true
          CONTAINER_SCAN=false
          while IFS= read -r file; do
            if [[ "$file" =~ (^|/)(AGENTS|CLAUDE|SECURITY)\.md$ ]] || \
               [[ "$file" == docs/.vitepress/* ]] || \
               [[ "$file" == docs/SDLC/* ]] || \
               [[ "$file" == docs/openapi/* ]] || \
               [[ "$file" == docs/kernel/* ]] || \
               [[ "$file" == docs/adr/* ]] || \
               [[ "$file" == .agents/* ]] || \
               [[ "$file" == .github/* ]] || \
               [[ "$file" == *.sh ]] || \
               [[ "$file" == *"vulnerability_exclusions_ledger.json" ]] || \
               [[ "$file" == *"VulnerabilityAuditorService.cs" ]]; then
              echo "Unsafe file: $file"
              SAFE=false
            elif [[ "$file" =~ ^(README|ARCHITECTURE|CONTEXT|CONTRIBUTING|SUPPORT)\.md$ ]] || \
                 [[ "$file" =~ ^(apps|packages)/[A-Za-z0-9][A-Za-z0-9._-]*(/[A-Za-z0-9][A-Za-z0-9._-]*)?/README\.md$ ]] || \
                 [[ "$file" =~ ^docs/(BACKLOG_INSIGHTS_ARCHIVE|CI|COMPETITIVE_ANALYSIS_AND_MARKET_SUPERIORITY|DATA_LIFECYCLE|DOCUMENTATION_INDEX|ENVIRONMENT_VARIABLES|FEATURE_MATRIX|GOALS_AND_PRIORITIES|ISSUE_MANAGEMENT|LOCAL_DEV_ENVIRONMENT|MIGRATION_WORKFLOW|OPERATIONAL_DATABASE|OPERATIONAL_INBOUND_EMAIL|OPERATIONAL_LAB_RANGES|PROJECT_PLAN|PYTHON_REFERENCE_INVENTORY|TESTING|cli)\.md$ ]] || \
                 [[ "$file" =~ ^docs/(architecture|components|migration|strategy|ux|web)/([A-Za-z0-9][A-Za-z0-9._-]*/)*[A-Za-z0-9][A-Za-z0-9._-]*\.md$ ]]; then
              echo "Safe prose Markdown file: $file"
            else
              echo "Unsafe file: $file"
              SAFE=false
            fi

            case "$file" in
              docker/*|Dockerfile*|*/Dockerfile*|.dockerignore|.github/dependabot.yml|.github/workflows/ci.yml|.config/dotnet-tools.json|Cadence.sln|global.json|.editorconfig|BannedSymbols.txt|Directory.Build.props|Directory.Build.targets|Directory.Packages.props|NuGet.Config|*.csproj|apps/**/*.cs|packages/**/*.cs)
                echo "Container/dependency trigger file: $file"
                CONTAINER_SCAN=true
                ;;
            esac
          done < changed_files.txt

          echo "is_safe=$SAFE" >> "$GITHUB_OUTPUT"
          echo "container_scan=$CONTAINER_SCAN" >> "$GITHUB_OUTPUT"

      - name: Apply label
        if: steps.classify.outputs.is_safe == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr edit "$PR_NUMBER" --repo "${{ github.repository }}" --add-label "safe-change"

  automerge:
    name: Enable Automerge
    needs: [classify, ci-gate]
    if: >-
      always() &&
      !cancelled() &&
      github.event_name == 'pull_request' &&
      needs.classify.outputs.is_safe == 'true' &&
      needs.ci-gate.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Enable Automerge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr merge "$PR_NUMBER" \
            --repo "${{ github.repository }}" \
            --auto \
            --squash || echo "::warning::Automerge enablement skipped or failed."

  release-and-archive:
    name: Call Production Pipeline
    needs:
      [
        actionlint,
        lint-and-static,
        dotnet-quality,
        native-aot-build,
        docs-build,
        security,
        container-security,
        unit-tests,
        dotnet-tests,
        accessibility-e2e,
        compliance,
      ]
    if: >-
      always() &&
      !cancelled() &&
      (
        github.event_name == 'push' ||
        (
          github.event_name == 'workflow_dispatch' &&
          (inputs.target == 'all' || inputs.target == 'release-and-archive')
        )
      ) &&
      (
        github.ref == 'refs/heads/main' ||
        startsWith(github.ref, 'refs/heads/release/') ||
        startsWith(github.ref, 'refs/tags/v')
      ) &&
      needs.actionlint.result == 'success' &&
      needs.lint-and-static.result == 'success' &&
      needs.dotnet-quality.result == 'success' &&
      needs.native-aot-build.result == 'success' &&
      needs.docs-build.result == 'success' &&
      needs.security.result == 'success' &&
      needs.container-security.result == 'success' &&
      needs.unit-tests.result == 'success' &&
      needs.dotnet-tests.result == 'success' &&
      needs.accessibility-e2e.result == 'success' &&
      needs.compliance.result == 'success'
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/production-pipeline.yml

  deploy-docs:
    name: Call Deploy Docs
    needs:
      [
        actionlint,
        lint-and-static,
        dotnet-quality,
        native-aot-build,
        docs-build,
        security,
        container-security,
        unit-tests,
        dotnet-tests,
        accessibility-e2e,
        compliance,
      ]
    if: >-
      always() &&
      !cancelled() &&
      (
        github.event_name == 'push' ||
        (
          github.event_name == 'workflow_dispatch' &&
          (inputs.target == 'all' || inputs.target == 'deploy-docs')
        )
      ) &&
      github.ref == 'refs/heads/main' &&
      needs.actionlint.result == 'success' &&
      needs.lint-and-static.result == 'success' &&
      needs.dotnet-quality.result == 'success' &&
      needs.native-aot-build.result == 'success' &&
      needs.docs-build.result == 'success' &&
      needs.security.result == 'success' &&
      needs.container-security.result == 'success' &&
      needs.unit-tests.result == 'success' &&
      needs.dotnet-tests.result == 'success' &&
      needs.accessibility-e2e.result == 'success' &&
      needs.compliance.result == 'success'
    permissions:
      contents: read
      pages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/deploy-docs.yml
