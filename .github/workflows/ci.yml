name: CI

on:
  push:
    branches: [main, release/*]
  pull_request:
    branches: [main, release/*]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  style:
    name: Style and Lint Verification
    runs-on: ubuntu-latest
    env:
      RTM_DRAFT: "true"
    permissions:
      contents: read
    outputs:
      cadence_outcome: ${{ steps.run_cadence_check.outcome }}
      contracts_outcome: ${{ steps.run_contracts.outcome }}
      linting_outcome: ${{ steps.run_linting.outcome }}
      frontend_outcome: ${{ steps.run_frontend.outcome }}
      adr_outcome: ${{ steps.run_adr.outcome }}
      duplication_outcome: ${{ steps.run_duplication.outcome }}
      traceability_outcome: ${{ steps.run_traceability.outcome }}
      openapi_drift_outcome: ${{ steps.run_openapi_drift.outcome }}
      markdown_outcome: ${{ steps.run_markdown.outcome }}
      architecture_outcome: ${{ steps.run_architecture.outcome }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Build UI package
        run: pnpm --filter ui build

      - name: Run frontend style and lint
        id: run_frontend
        if: always()
        run: |
          pnpm --filter web --filter subject-portal --filter ui exec prettier --check .
          pnpm -r lint

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build .NET solution
        run: dotnet build Cadence.sln

      - name: Verify .NET C# code formatting (.editorconfig)
        id: run_linting
        if: always()
        run: dotnet format Cadence.sln --verify-no-changes --no-restore

      - name: Run Cadence quality sentinels
        id: run_cadence_check
        if: always()
        run: dotnet run --no-build --project packages/cli/src/Cadence.Cli.csproj -- check

      - name: Run architecture tests
        id: run_architecture
        if: always()
        run: dotnet test tests/Cadence.ArchitectureTests.csproj --no-build

      - name: Run hexagonal contract verification
        id: run_contracts
        if: always()
        run: dotnet run --no-build --project packages/cli/src/Cadence.Cli.csproj -- check contracts

      - name: Run Hadolint on Dockerfiles
        run: |
          if ! command -v hadolint >/dev/null 2>&1; then
            echo "Installing hadolint..."
            for i in {1..5}; do
              sudo curl --connect-timeout 15 --retry 5 --retry-delay 5 -sSfL -o /usr/local/bin/hadolint https://github.com/hadolint/hadolint/releases/download/v2.15.1/hadolint-Linux-x86_64 && break || {
                if [ "$i" -eq 5 ]; then
                  echo "::error::Failed to install hadolint after 5 attempts."
                  exit 1
                fi
                echo "Download failed, retrying in 5 seconds... (Attempt $i/5)"
                sleep 5
              }
            done
            if [ -f /usr/local/bin/hadolint ]; then
              sudo chmod +x /usr/local/bin/hadolint || true
            fi
          fi
          if command -v hadolint >/dev/null 2>&1; then
            DOCKERFILES=$(find . -type f -name Dockerfile)
            echo "Linting Dockerfiles:"
            echo "$DOCKERFILES"
            hadolint --failure-threshold error $DOCKERFILES
          else
            echo "::error::Hadolint is not installed or unavailable."
            exit 1
          fi

      - name: Run ShellCheck on shell scripts
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            echo "Installing shellcheck..."
            sudo apt-get update && sudo apt-get install -y shellcheck || {
              echo "::error::Failed to install shellcheck."
              exit 1
            }
          fi
          if command -v shellcheck >/dev/null 2>&1; then
            SHELL_SCRIPTS=$(find . -type f -name "*.sh" -not -path "*/.venv/*" -not -path "*/node_modules/*")
            echo "Linting shell scripts: $SHELL_SCRIPTS"
            shellcheck $SHELL_SCRIPTS
          else
            echo "::error::ShellCheck is not installed or unavailable."
            exit 1
          fi

      - name: Run ADR validation
        id: run_adr
        if: always()
        run: dotnet run --no-build --project packages/cli/src/Cadence.Cli.csproj -- check adrs

      - name: Run CODEOWNERS coverage validation
        id: run_codeowners
        if: always()
        run: dotnet run --no-build --project packages/cli/src/Cadence.Cli.csproj -- validate-codeowners

      - name: Run Markdown validation
        id: run_markdown
        if: always()
        run: dotnet run --no-build --project packages/cli/src/Cadence.Cli.csproj -- check markdown

      - name: Run documentation compilation
        id: run_docs_build
        if: always()
        run: pnpm docs:build

      - name: Verify schema documentation freshness
        id: run_schema_drift
        if: always()
        run: |
          dotnet run --no-build --project packages/cli/src/Cadence.Cli.csproj -- check schema-doc
          git diff --exit-code docs/schema_visualizer.html docs/schema/ docs/CDISC/

      - name: Verify OpenAPI specification drift
        id: run_openapi_drift
        if: always()
        run: dotnet run --no-build --project packages/cli/src/Cadence.Cli.csproj -- check openapi

      - name: Run requirements traceability validation
        id: run_traceability
        if: always()
        run: dotnet run --no-build --project packages/cli/src/Cadence.Cli.csproj -- check rtm

      - name: Run code duplication verification
        id: run_duplication
        if: always()
        run: |
          git fetch origin main --depth=1 || true
          CHANGED_FILES=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            CHANGED_FILES=$(git diff --name-only origin/main...HEAD 2>/dev/null | grep -E '\.(py|js|vue|css|cs)$' || true)
          else
            CHANGED_FILES=$(git diff --name-only HEAD~1..HEAD 2>/dev/null | grep -E '\.(py|js|vue|css|cs)$' || true)
          fi
          if [ -n "$CHANGED_FILES" ]; then
            dotnet run --no-build --project packages/cli/src/Cadence.Cli.csproj -- check duplication $CHANGED_FILES
          else
            # Fallback to scanning git status (staged/unstaged files)
            CHANGED_FILES=$(git status --porcelain | awk '{print $2}' | grep -E '\.(py|js|vue|css|cs)$' || true)
            if [ -n "$CHANGED_FILES" ]; then
              dotnet run --no-build --project packages/cli/src/Cadence.Cli.csproj -- check duplication $CHANGED_FILES
            else
              echo "No relevant files changed."
            fi
          fi

      - name: Upload Duplication Summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: duplication-summary
          path: duplication_summary.json

  security:
    name: Security and Vulnerability Audit
    runs-on: ubuntu-latest
    env:
      UV_NO_SYNC: "1"
    permissions:
      contents: read
    outputs:
      audit_outcome: ${{ steps.run_audit.outcome }}
      static_outcome: ${{ steps.run_static.outcome }}
      secrets_outcome: ${{ steps.run_secrets.outcome }}
      deid_outcome: ${{ steps.run_deid_scan.outcome }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Run static analysis
        id: run_static
        if: always()
        run: dotnet run --project packages/cli/src/Cadence.Cli.csproj -- check audit-security

      - name: Build container image for security scan
        run: |
          docker build -t cadence-gateway:latest -f apps/gateway/Dockerfile .

      - name: Run container vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'cadence-gateway:latest'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Run dependency audit
        id: run_audit
        if: always()
        run: dotnet run --project packages/cli/src/Cadence.Cli.csproj -- check vulnerabilities

      - name: Run secret detection
        id: run_secrets
        if: always()
        run: |
          git add .secrets.baseline
          dotnet run --project packages/cli/src/Cadence.Cli.csproj -- check clean-secrets
          dotnet run --project packages/cli/src/Cadence.Cli.csproj -- check security

      - name: Run DEID compliance scan
        id: run_deid_scan
        if: always()
        run: |
          git fetch origin main --depth=1 || true
          CHANGED_FILES=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            CHANGED_FILES=$(git diff --name-only origin/main...HEAD 2>/dev/null | grep -E '\.(py|js|ts|tsx|jsx|json|md|log|txt|cs)$' || true)
          else
            CHANGED_FILES=$(git diff --name-only HEAD~1..HEAD 2>/dev/null | grep -E '\.(py|js|ts|tsx|jsx|json|md|log|txt|cs)$' || true)
          fi
          if [ -n "$CHANGED_FILES" ]; then
            echo "Scanning changed files: $CHANGED_FILES"
            dotnet run --project packages/cli/src/Cadence.Cli.csproj -- check deid $CHANGED_FILES
          else
            echo "No changed files to scan."
          fi

  unit-tests:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      test_outcome: ${{ steps.run_tests.outcome }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build UI package
        run: pnpm --filter ui build

      - name: Run frontend unit tests
        id: run_tests
        if: always()
        run: pnpm -r test


  dotnet-tests:
    name: .NET 10 C# xUnit Verification
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      test_outcome: ${{ steps.run_dotnet_tests.outcome }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore NuGet Packages
        run: dotnet restore Cadence.sln

      - name: Build .NET 10 Solution
        run: dotnet build Cadence.sln --configuration Release --no-restore

      - name: Execute .NET 10 xUnit Test Suites
        id: run_dotnet_tests
        if: always()
        run: dotnet test Cadence.sln --configuration Release --no-build --logger "trx;LogFileName=report_dotnet.trx"

      - name: Upload .NET TRX Test Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trx-report-dotnet
          path: tests/**/TestResults/*.trx

  integration-tests:
    name: Playwright Integration Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      test_outcome: ${{ steps.run_tests.outcome }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Run backend integration tests
        id: run_tests
        if: always()
        run: dotnet test Cadence.sln --configuration Release --filter "Category=Integration|Category=E2E" --logger "trx;LogFileName=report_dotnet.trx"

      - name: Upload integration test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-report-integration
          path: tests/**/TestResults/*.trx

  qualification-tests:
    name: Isolated GxP Qualification Suite
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      test_outcome: ${{ steps.run_tests.outcome }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Run GxP qualification validation suite
        id: run_tests
        if: always()
        run: dotnet test Cadence.sln --configuration Release --filter "Category=E2E|Category=Validation" --logger "trx;LogFileName=report_dotnet.trx"

      - name: Upload qualification test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-report-qualification
          path: tests/**/TestResults/*.trx

  accessibility-e2e:
    name: Parallel E2E Accessibility Testing
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright Browsers
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            echo "Playwright cache hit detected. Installing system dependencies and verifying browser binary..."
            pnpm exec playwright install-deps chromium
            pnpm exec playwright install chromium
          else
            echo "Playwright cache miss. Performing full browser installation..."
            for i in {1..3}; do
              pnpm exec playwright install chromium --with-deps && break || {
                echo "Playwright install failed on attempt $i, retrying in 10s..."
                sleep 10
              }
            done
          fi

      - name: Build UI package
        run: pnpm --filter ui build

      - name: Run Subject Portal E2E Accessibility Tests
        run: pnpm --filter subject-portal test:e2e

      - name: Run Web Application E2E Accessibility Tests
        run: pnpm --filter web test:e2e

  compliance:
    name: GxP Compliance & Qualification Reporting
    runs-on: ubuntu-latest
    needs: [unit-tests, dotnet-tests, integration-tests, qualification-tests]
    if: always() && needs.unit-tests.outputs.test_outcome == 'success' && needs.dotnet-tests.outputs.test_outcome == 'success' && needs.integration-tests.outputs.test_outcome == 'success' && needs.qualification-tests.outputs.test_outcome == 'success'
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Download Unit Test Report
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: junit-report-unit
          path: .
          merge-multiple: true

      - name: Download Integration Test Report
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: junit-report-integration
          path: .
          merge-multiple: true

      - name: Download Qualification Test Report
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: junit-report-qualification
          path: .
          merge-multiple: true

      - name: Generate Compliance Reports
        run: dotnet run --project packages/cli/src/Cadence.Cli.csproj -- gxp sync

      - name: Assert No Documentation Git Diff
        run: |
          echo "==== Comparing freshly generated reports against checked-in files ===="
          git diff docs/SDLC/Requirements_Traceability_Matrix.md docs/SDLC/IQ_OQ_PQ_Execution_Report.md
          git diff --exit-code docs/SDLC/Requirements_Traceability_Matrix.md docs/SDLC/IQ_OQ_PQ_Execution_Report.md || {
            echo "::error::GxP compliance documentation is out of sync with the current system state!"
            echo "::error::Please run 'dotnet run --project packages/cli/src/Cadence.Cli.csproj -- gxp sync' locally, and commit/push the updated files in 'docs/SDLC/'."
            exit 1
          }

  comment:
    name: Post PR Quality Checklist Comment
    if: always() && github.event_name == 'pull_request'
    needs: [style, security, unit-tests, dotnet-tests, integration-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Download Duplication Summary
        if: always()
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: duplication-summary
          path: .
          merge-multiple: true

      - name: Post PR Comment
        env:
          GH_TOKEN: ${{ secrets.PAT_FDERUITER || secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CADENCE_OUTCOME: ${{ needs.style.outputs.cadence_outcome }}
          CONTRACTS_OUTCOME: ${{ needs.style.outputs.contracts_outcome }}
          LINTING_OUTCOME: ${{ needs.style.outputs.linting_outcome }}
          DOTNET_TEST_OUTCOME: ${{ needs.dotnet-tests.outputs.test_outcome }}
          TEST_OUTCOME: ${{ (needs.unit-tests.outputs.test_outcome == 'success' && needs.integration-tests.outputs.test_outcome == 'success') && 'success' || 'failure' }}
          FRONTEND_OUTCOME: ${{ needs.style.outputs.frontend_outcome }}
          ADR_OUTCOME: ${{ needs.style.outputs.adr_outcome }}
          AUDIT_OUTCOME: ${{ needs.security.outputs.audit_outcome }}
          STATIC_OUTCOME: ${{ needs.security.outputs.static_outcome }}
          SECRETS_OUTCOME: ${{ needs.security.outputs.secrets_outcome }}
          DEID_OUTCOME: ${{ needs.security.outputs.deid_outcome }}
          DUPLICATION_OUTCOME: ${{ needs.style.outputs.duplication_outcome }}
          TRACEABILITY_OUTCOME: ${{ needs.style.outputs.traceability_outcome }}
          MARKDOWN_OUTCOME: ${{ needs.style.outputs.markdown_outcome }}
          ARCHITECTURE_OUTCOME: ${{ needs.style.outputs.architecture_outcome }}
        run: dotnet run --project packages/cli/src/Cadence.Cli.csproj -- post-pr-comment
  classify:
    name: Classify Change
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      is_safe: ${{ steps.classify.outputs.is_safe }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Fetch list of changed files
        id: classify
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request && github.event.pull_request.number || '0' }}/files --paginate --jq '.[] | .filename, (select(has("previous_filename")) | .previous_filename)' > changed_files.tmp
          sort -u changed_files.tmp > changed_files.txt
          cat changed_files.txt

          if [ ! -s changed_files.txt ]; then
            echo "No files changed."
            echo "is_safe=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          SAFE=true
          while IFS= read -r file; do
            if [[ "$file" == *"vulnerability_exclusions_ledger.json" ]] || [[ "$file" == *"validate_vulnerabilities"* ]]; then
              echo "Unsafe vulnerability/validation file: $file"
              SAFE=false
              break
            elif [[ "$file" == docs/* ]] || [[ "$file" == *.md ]]; then
              echo "Safe file: $file"
            else
              echo "Unsafe file: $file"
              SAFE=false
              break
            fi
          done < changed_files.txt

          echo "is_safe=$SAFE" >> $GITHUB_OUTPUT

      - name: Apply label
        if: steps.classify.outputs.is_safe == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "safe-change" --repo ${{ github.repository }} --color "0E8A16" --description "Safe non-GxP change" --force || true
          gh pr edit ${{ github.event.pull_request && github.event.pull_request.number || '0' }} --repo ${{ github.repository }} --add-label "safe-change" || echo "Failed to apply label. Ignoring."

  automerge:
    name: Approve and Automerge
    needs:
      [classify, style, security, unit-tests, dotnet-tests, integration-tests, compliance, accessibility-e2e]
    if: github.event_name == 'pull_request' && needs.classify.outputs.is_safe == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Approve Pull Request
        env:
          GH_TOKEN: ${{ secrets.SERVICE_ACCOUNT_TOKEN || secrets.PAT_FDERUITER || secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr review "$PR_NUMBER" \
            --repo "${{ github.repository }}" \
            --approve \
            --body "Programmatic approval: Verified safe non-GxP change." || echo "::warning::Programmatic approval skipped or failed."

      - name: Enable Automerge
        env:
          GH_TOKEN: ${{ secrets.SERVICE_ACCOUNT_TOKEN || secrets.PAT_FDERUITER || secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr merge "$PR_NUMBER" \
            --repo "${{ github.repository }}" \
            --auto \
            --squash || echo "::warning::Automerge enablement skipped or failed."

  sync-ruleset:
    name: Sync Branch Ruleset
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Sync Ruleset
        env:
          GH_TOKEN: ${{ secrets.SERVICE_ACCOUNT_TOKEN || secrets.PAT_FDERUITER || secrets.GITHUB_TOKEN }}
        run: |
          dotnet run --project packages/cli/src/Cadence.Cli.csproj -- sync-ruleset

  release-and-archive:
    name: Call Production Pipeline
    needs: [style, security, compliance]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/production-pipeline.yml

  deploy-docs:
    name: Call Deploy Docs
    needs: [release-and-archive]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-docs.yml
