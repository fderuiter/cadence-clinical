name: GitHub Project & Issue Automation

on:
  issues:
    types: [opened, edited, labeled, unlabeled, closed, reopened]
  pull_request:
    types: [opened, closed, reopened, synchronize]
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: project-automation
  cancel-in-progress: false
jobs:
  sync-project-and-issues:
    name: Sync Project Board & Format Issues
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: read
      repository-projects: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Run Project & Issue Sync
        env:
          GH_TOKEN: ${{ secrets.PAT_FDERUITER || secrets.GITHUB_TOKEN }}
        run: |
          dotnet run --project packages/cli/src/Cadence.Cli.csproj -- sync-github-project
