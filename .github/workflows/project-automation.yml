name: GitHub Project & Issue Automation

on:
  issues:
    types: [opened, edited, labeled, unlabeled, closed, reopened]
  pull_request:
    types: [opened, closed, reopened, synchronized]
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync-project-and-issues:
    name: Sync Project Board & Format Issues
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: read
      repository-projects: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Project & Issue Sync
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/sync_github_project.py
