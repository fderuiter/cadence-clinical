name: GitHub Project & Issue Automation

on:
  issues:
    types: [opened, edited, labeled, unlabeled, closed, reopened]
  pull_request:
    types: [opened, closed, reopened, synchronize]
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: project-automation
  cancel-in-progress: false
jobs:
  sync-project-and-issues:
    name: Sync Project Board & Format Issues
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: read
      repository-projects: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Run Project & Issue Sync
        env:
          GH_TOKEN: ${{ secrets.PAT_FDERUITER || secrets.GITHUB_TOKEN }}
        run: |
          uv run python scripts/sync_github_project.py
