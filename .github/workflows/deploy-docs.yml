name: Deploy Developer Documentation

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build Developer Documentation
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            global.json

      - name: Build UI package
        run: pnpm --filter ui build

      - name: Build Demo Web Application
        run: pnpm --filter web exec vite build --mode demo --base=/cadence-clinical/demo/

      - name: Build Documentation Portal
        env:
          CADENCE_DOCS_SKIP_CHECKS: "1"
        run: pnpm docs:build

      - name: Stage Demo Web Application into Portal Output
        run: |
          mkdir -p docs/.vitepress/dist/demo
          cp -R apps/web/dist/. docs/.vitepress/dist/demo/

      - name: Verify Public Bundles
        run: node scripts/run-cli.js check public-bundle

      - name: Generate Documentation Artifact SHA256 Checksums
        run: |
          (cd docs/.vitepress/dist && LC_ALL=C find . -type f -print0 | sort -z | xargs -0 sha256sum) > "$RUNNER_TEMP/SHA256SUMS"
          mv "$RUNNER_TEMP/SHA256SUMS" docs/.vitepress/dist/SHA256SUMS
          (cd docs/.vitepress/dist && sha256sum -c SHA256SUMS)
          head -n 20 docs/.vitepress/dist/SHA256SUMS

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: docs/.vitepress/dist

      - name: Generate SLSA Build Provenance for Documentation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "${{ runner.temp }}/artifact.tar"

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
