name: Cadence .NET 10 CI & GxP Compliance Gate

on:
  push:
    branches:
      - main
      - master
      - dotnet-migration
  pull_request:
    branches:
      - main
      - master
      - dotnet-migration

jobs:
  build-and-verify:
    name: Build, Test & GxP Compliance (.NET 10)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Setup Python Runtime (for GxP Verification)
        run: uv python install 3.14

      - name: Restore NuGet Packages
        run: dotnet restore Cadence.sln

      - name: Build Solution (Release)
        run: dotnet build Cadence.sln --configuration Release --no-restore

      - name: Verify Code Formatting (.editorconfig)
        run: dotnet format Cadence.sln --verify-no-changes

      - name: Execute Test Suites
        run: dotnet test Cadence.sln --configuration Release --no-build --logger "trx;LogFileName=test_results.trx"

      - name: Validate Architecture Decision Records (ADRs)
        run: uv run --python 3.14 python scripts/validate_adrs.py

      - name: Verify GxP Requirements Traceability (RTM Drift Check)
        run: |
          uv run --python 3.14 python scripts/sync_gxp.py
          git diff --exit-code docs/SDLC/Requirements_Traceability_Matrix.md || (echo "::error::GxP RTM drift detected! Run 'python scripts/sync_gxp.py' locally and commit updated docs." && exit 1)
