name: Conflict Check

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  conflict-check:
    name: Check for Merge Conflicts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 0

      - name: Check mergeability with git merge-tree
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}" \
            "+refs/pull/${PR_NUMBER}/head:refs/remotes/origin/pr/${PR_NUMBER}"
          if ! git merge-tree --write-tree "refs/remotes/origin/${BASE_REF}" "refs/remotes/origin/pr/${PR_NUMBER}"; then
            echo "::error::This pull request has merge conflicts with '${BASE_REF}'. Merge or rebase onto 'origin/${BASE_REF}' and resolve them."
            exit 1
          fi
