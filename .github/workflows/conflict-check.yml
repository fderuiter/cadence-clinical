name: Conflict Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  conflict-check:
    name: Check for Merge Conflicts
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Check mergeable status
        id: check_status
        env:
          GH_TOKEN: ${{ secrets.PAT_FDERUITER || secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          STATUS="UNKNOWN"
          for _ in {1..6}; do
            STATUS=$(gh pr view "$PR_NUMBER" --json mergeable --jq .mergeable 2>/dev/null || echo "UNKNOWN")
            if [ "$STATUS" != "UNKNOWN" ]; then
              break
            fi
            echo "Mergeable status is UNKNOWN. Retrying in 10 seconds..."
            sleep 10
          done
          echo "Final mergeable status: $STATUS"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"

      - name: Fail on merge conflict
        env:
          STATUS: ${{ steps.check_status.outputs.status }}
        run: |
          if [ "$STATUS" = "CONFLICTING" ]; then
            echo "::error::This pull request has merge conflicts with its base branch. Merge the base branch in and resolve them."
            exit 1
          fi

