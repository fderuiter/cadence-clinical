name: Conflict Check

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  conflict-check:
    name: Check for Merge Conflicts & Autonomous Self-Healing
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Use GITHUB_TOKEN for safe and always-valid checkout
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          fetch-depth: 0

      - name: Checkout trusted base branch
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.base.ref || 'main' }}
          path: .github/trusted-base

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check mergeable status
        id: check_status
        env:
          GH_TOKEN: ${{ secrets.PAT_FDERUITER || secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          STATUS="UNKNOWN"
          for i in {1..6}; do
            STATUS=$(gh pr view "$PR_NUMBER" --json mergeable --jq .mergeable 2>/dev/null || echo "UNKNOWN")
            if [ "$STATUS" != "UNKNOWN" ]; then
              break
            fi
            echo "Mergeable status is UNKNOWN. Retrying in 10 seconds..."
            sleep 10
          done
          echo "Final mergeable status: $STATUS"
          echo "status=$STATUS" >> $GITHUB_OUTPUT

      - name: Autonomous Self-Healing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          # Only attempt self-healing if PR_NUMBER is set
          if [ -n "$PR_NUMBER" ]; then
            python3 .github/trusted-base/scripts/self_heal.py
          fi

      - name: Post PR Quality Checklist Comment on Conflict Fallback
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CONFLICT_OUTCOME: "failure"
        run: |
          if [ -f ".github/trusted-base/scripts/post_pr_comment.py" ]; then
            python3 .github/trusted-base/scripts/post_pr_comment.py
          else
            python3 scripts/post_pr_comment.py
          fi
