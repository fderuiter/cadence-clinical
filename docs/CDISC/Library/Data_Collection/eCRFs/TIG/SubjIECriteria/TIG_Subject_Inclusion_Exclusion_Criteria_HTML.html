<!DOCTYPE html
  PUBLIC "-//W3C//DTD HTML 4.01//EN">
<html>
   <head>
      <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
      <title>"Tobacco Implementation Guide-Inclusion/Exclusion [TIG_INC/EXC]" Form Preview
				</title>
   </head>
   <body link="#6666aa" vlink="#8888ff" alink="#8888ff" style="margin: 0em 1em">
      <form action="javascript:">
         <table width="100%" align="center" cellspacing="0" cellpadding="4" bgcolor="#bad8eb" style="clear: right; color: #000000; margin-top: 1em">
            <tr bgcolor="#0090b2" align="left" valign="top" style="font-size: 1em; color: #ffffff; font-family: Arial, Helvetica, Verdana, sans-serif">
               <td colspan="100%" nowrap>Tobacco Implementation Guide-Inclusion/Exclusion</td>
            </tr>
            <tr bgcolor="#bad8eb" align="left" valign="top" style="font-size: 0.9em; color: #000000; font-family: Arial, Helvetica, Verdana, sans-serif">
               <td colspan="2"><b>Any Inc/Exc</b></td>
            </tr>
            <tr bgcolor="#d5e7f3" align="left" valign="top" style="font-size: 0.9em; color: #000000; font-family: Arial, Helvetica, Verdana, sans-serif">
               <td width="25%">Were all eligibility criteria met?</td>
               <td width="75%"><input type="text" name="IE_TIG_INC/EXC_ANY.IEYN" size="20" title="Field Name: IE_TIG_INC/EXC_ANY.IEYN"></td>
            </tr>
            <tr bgcolor="#bad8eb" align="left" valign="top" style="font-size: 0.9em; color: #000000; font-family: Arial, Helvetica, Verdana, sans-serif">
               <td colspan="2"><b>Inc/Exc Criteria</b></td>
            </tr>
            <tr bgcolor="#d5e7f3" align="left" valign="top" style="font-size: 0.9em; color: #000000; font-family: Arial, Helvetica, Verdana, sans-serif">
               <td width="25%">What was the category of the criterion?</td>
               <td width="75%"><input type="text" name="IE_TIG_INC_EXC_CRITERIA.IECAT" size="20" title="Field Name: IE_TIG_INC_EXC_CRITERIA.IECAT"></td>
            </tr>
            <tr bgcolor="#d5e7f3" align="left" valign="top" style="font-size: 0.9em; color: #000000; font-family: Arial, Helvetica, Verdana, sans-serif">
               <td width="25%">What was the identifier of the inclusion criterion the subject did not meet or the exclusion criterion the subject met?</td>
               <td width="75%"><input type="text" name="IE_TIG_INC_EXC_CRITERIA.IETESTCD" size="20" title="Field Name: IE_TIG_INC_EXC_CRITERIA.IETESTCD"></td>
            </tr>
         </table>
         <table width="100%" align="center">
            <tr style="font-size: 8pt; font-family: Arial, Helvetica, Verdana, sans-serif">
               <td><font color="red">*</font> Mandatory field</td>
            </tr>
         </table>
      </form>
   </body>
</html>
