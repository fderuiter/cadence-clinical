<!DOCTYPE html
  PUBLIC "-//W3C//DTD HTML 4.01//EN">
<html>
   <head>
      <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
      <title>"Form RP - Reproductive System Findings [RP_REPRODUCTIVE_SYSTEM_FINDINGS]" Form Preview 
         				
      </title>
   </head>
   <body link="#6666aa" vlink="#8888ff" alink="#8888ff" style="margin: 0em 1em">
      <form action="javascript:">
         <table width="100%" align="center" cellspacing="0" cellpadding="4" bgcolor="#bad8eb" style="clear: right; color: #000000; margin-top: 1em">
            <tr bgcolor="#0090b2" align="left" valign="top" style="font-size: 1em; color: #ffffff; font-family: Arial, Helvetica, Verdana, sans-serif">
               <td colspan="100%" nowrap>Form RP - Reproductive System Findings</td>
            </tr>
            <tr bgcolor="#bad8eb" align="left" valign="top" style="font-size: 0.9em; color: #000000; font-family: Arial, Helvetica, Verdana, sans-serif">
               <td colspan="2"><b>RP - Reproductive System Findings</b></td>
            </tr>
            <tr bgcolor="#d5e7f3" align="left" valign="top" style="font-size: 0.9em; color: #000000; font-family: Arial, Helvetica, Verdana, sans-serif">
               <td width="25%">Was a reproductive system evaluation performed?</td>
               <td width="75%"><input type="radio" name="IT.RPPERF" title="Field Name: IT.RPPERF" value="N">No<font color="#d5e7f3">&nbsp;&nbsp;</font><input type="radio" name="IT.RPPERF" title="Field Name: IT.RPPERF" value="Y">Yes<font color="#d5e7f3">&nbsp;&nbsp;</font></td>
            </tr>
            <tr bgcolor="#d5e7f3" align="left" valign="top" style="font-size: 0.9em; color: #000000; font-family: Arial, Helvetica, Verdana, sans-serif">
               <td width="25%">Reason Not Done</td>
               <td width="75%"><input type="text" name="IT.RPREASND" size="20" title="Field Name: IT.RPREASND"></td>
            </tr>
            <tr bgcolor="#d5e7f3" align="left" valign="top" style="font-size: 0.9em; color: #000000; font-family: Arial, Helvetica, Verdana, sans-serif">
               <td width="25%">Collection Date</td>
               <td width="75%">
                  <table border="0" cellspacing="0" cellpadding="0" style="font-size: 0.9em; color: #000000; font-family: Arial, Helvetica, Verdana, sans-serif">
                     <tr>
                        <td width="35"><input type="submit" name="IT.RPDAT" value="Set Date" title="Field Name: IT.RPDAT" style="background-color: #d5e7f3; color: #000000"></td>
                        <td><font color="#d5e7f3">&nbsp;</font>01 Jan 2000
                        </td>
                     </tr>
                  </table>
               </td>
            </tr>
            <tr bgcolor="#d5e7f3" align="left" valign="top" style="font-size: 0.9em; color: #000000; font-family: Arial, Helvetica, Verdana, sans-serif">
               <td width="25%">Was the subject of child bearing potential?</td>
               <td width="75%"><input type="radio" name="IT.RPORRES" title="Field Name: IT.RPORRES" value="N">No<font color="#d5e7f3">&nbsp;&nbsp;</font><input type="radio" name="IT.RPORRES" title="Field Name: IT.RPORRES" value="Y">Yes<font color="#d5e7f3">&nbsp;&nbsp;</font></td>
            </tr>
            <tr bgcolor="#d5e7f3" align="left" valign="top" style="font-size: 0.9em; color: #000000; font-family: Arial, Helvetica, Verdana, sans-serif">
               <td width="25%">Menopause Status</td>
               <td width="75%"><input type="radio" name="IT.RPORRES_MENOSTAT" title="Field Name: IT.RPORRES_MENOSTAT" value="PRE">Premenopausal<font color="#d5e7f3">&nbsp;&nbsp;</font><input type="radio" name="IT.RPORRES_MENOSTAT" title="Field Name: IT.RPORRES_MENOSTAT" value="POST">Postmenopausal<font color="#d5e7f3">&nbsp;&nbsp;</font></td>
            </tr>
         </table>
         <table width="100%" align="center">
            <tr style="font-size: 8pt; font-family: Arial, Helvetica, Verdana, sans-serif">
               <td><font color="red">*</font> Mandatory field
               </td>
            </tr>
         </table>
      </form>
   </body>
</html>
