<!DOCTYPE html
  PUBLIC "-//W3C//DTD HTML 4.01//EN">
<html>
   <head>
      <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
      <title>"Form DS - Disposition [DS_EOS]" Form Preview

      </title>
   </head>
   <body link="#6666aa" vlink="#8888ff" alink="#8888ff" style="margin: 0em 1em">
      <form action="javascript:">
         <table width="100%" align="center" cellspacing="0" cellpadding="4" bgcolor="#bad8eb" style="clear: right; color: #000000; margin-top: 1em">
            <tr bgcolor="#0090b2" align="left" valign="top" style="font-size: 1em; color: #ffffff; font-family: Arial, Helvetica, Verdana, sans-serif">
               <td colspan="100%" nowrap>Form DS - Disposition</td>
            </tr>
            <tr bgcolor="#bad8eb" align="left" valign="top" style="font-size: 0.9em; color: #000000; font-family: Arial, Helvetica, Verdana, sans-serif">
               <td colspan="2"><b>DS - Disposition</b></td>
            </tr>
            <tr bgcolor="#d5e7f3" align="left" valign="top" style="font-size: 0.9em; color: #000000; font-family: Arial, Helvetica, Verdana, sans-serif">
               <td width="25%">What was the subject's status at the end of study?</td>
               <td width="75%"><select id="IT.DSDECOD" name="IT.DSDECOD" title="Field Name: IT.DSDECOD">
                     <option value="" title="Field Name: IT.DSDECOD">Choose</option>
                     <option value="ADVERSE EVENT">Adverse Event</option>
                     <option value="COMPLETED">Completed</option>
                     <option value="DEATH">Death</option>
                     <option value="LOST TO FOLLOW-UP">Lost To Follow-Up</option>
                     <option value="PREGNANCY">Pregnancy</option>
                     <option value="PROGRESSIVE DISEASE">Progressive Disease</option>
                     <option value="PROTOCOL DEVIATION">Protocol Deviation</option>
                     <option value="SCREEN FAILURE">Screen Failure</option>
                     <option value="SITE TERMINATED BY SPONSOR">Site Terminated by Sponsor</option>
                     <option value="STUDY TERMINATED BY SPONSOR">Study Terminated By Sponsor</option>
                     <option value="WITHDRAWAL BY SUBJECT">Withdrawal by Subject</option>
                     <option value="OTHER">Other</option></select></td>
            </tr>
            <tr bgcolor="#d5e7f3" align="left" valign="top" style="font-size: 0.9em; color: #000000; font-family: Arial, Helvetica, Verdana, sans-serif">
               <td width="25%">What was the subject's status?; If [DSDECOD],
                  specify
               </td>
               <td width="75%"><input type="text" name="IT.DSTERM" size="20" title="Field Name: IT.DSTERM"></td>
            </tr>
            <tr bgcolor="#d5e7f3" align="left" valign="top" style="font-size: 0.9em; color: #000000; font-family: Arial, Helvetica, Verdana, sans-serif">
               <td width="25%">What was the study discontinuation or completion date?</td>
               <td width="75%">
                  <table border="0" cellspacing="0" cellpadding="0" style="font-size: 0.9em; color: #000000; font-family: Arial, Helvetica, Verdana, sans-serif">
                     <tr>
                        <td width="35"><input type="submit" name="IT.DSSTDAT" value="Set Date" title="Field Name: IT.DSSTDAT" style="background-color: #d5e7f3; color: #000000"></td>
                        <td><font color="#d5e7f3">&nbsp;</font>01 Jan 2000
                        </td>
                     </tr>
                  </table>
               </td>
            </tr>
         </table>
         <table width="100%" align="center">
            <tr style="font-size: 8pt; font-family: Arial, Helvetica, Verdana, sans-serif">
               <td><font color="red">*</font> Mandatory field
               </td>
            </tr>
         </table>
      </form>
   </body>
</html>
