[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
]
ignore = [
    "E501",  # line-length — handled by formatter
]

[tool.ruff.lint.per-file-ignores]
# models.py is auto-generated by Alembic tooling; import order and length
# violations are expected and excluded from both CLI and per-file checks.
"apps/execution/database/models.py" = ["E", "F", "I"]

# ---------------------------------------------------------------------------
# SQLAlchemy boolean filter pattern — IMPORTANT for all contributors
# ---------------------------------------------------------------------------
# Never use `Column == True` or `Column == False` in SQLAlchemy .where().
# Python's `==` emits a Python bool comparison (E712), not SQL.
# Use the ORM-correct form instead:
#
#   WRONG:  Model.is_active == True        # triggers E712, wrong SQL
#   WRONG:  Model.is_active == False       # triggers E712, wrong SQL
#   RIGHT:  Model.is_active.is_(True)      # emits: col IS TRUE
#   RIGHT:  Model.is_active.is_(False)     # emits: col IS FALSE
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "--cov=apps --cov=packages --cov-fail-under=80"
testpaths = [
    "tests",
]
python_files = "test_*.py *_test.py *tests.py *suite.py"
asyncio_mode = "auto"

[tool.coverage.run]
source = [
    "apps",
    "packages",
]
concurrency = ["thread", "greenlet"]

[tool.coverage.report]
fail_under = 80

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cadence-clinical"
version = "0.1.0"
description = "The Metadata-Driven Clinical Execution Platform"
authors = [
    { name = "Frederick de Ruiter", email = "fpderutier@gmail.com" },
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.139.2,<0.140.0",
    "uvicorn[standard]>=0.51.0,<0.52.0",
    "pydantic>=2.6.0",
    "httpx>=0.27.0",
    "neo4j>=5.18.0",
    "sqlalchemy>=2.0.28",
    "asyncpg>=0.29.0",
    "python-jose[cryptography]>=3.3.0",
    "usdm>=0.65.0",
    "defusedxml>=0.7.1,<0.8.0",
    "jinja2>=3.1.6,<4.0.0",
    "python-multipart>=0.0.32",
    "weasyprint>=61.0",
    "python-docx>=1.1.0",
    "aiosmtplib>=3.0.1",
    "rapidfuzz>=3.14.5",
    "pyyaml>=6.0.1",
    "docxtpl>=0.20.2",
    "docxcompose>=2.2.0",
]

[project.scripts]
deid-scan = "packages.deid.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.3.0",
    "aiosqlite>=0.22.1",
    "pytest-cov>=7.1.0",
    "pre-commit>=4.6.1",
    "detect-secrets>=1.5.0",
    "bandit>=1.9.4",
    "pip-audit>=2.10.1",
    "ecdsa>=0.19.2",
    "playwright>=1.40.0",
    "pytest-playwright>=0.4.0",
    "pytest-xdist>=3.5.0",
]

[tool.hatch.build.targets.wheel]
packages = [
    "apps",
    "packages"
]
