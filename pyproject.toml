[tool.ruff]
line-length = 88
target-version = "py314"
exclude = [
    ".git",
    ".venv",
    ".agents",
    "apps/execution/database/models.py"
]

[tool.uv.workspace]
members = [
    "apps/*",
    "packages/*"
]
exclude = [
    "apps/web",
    "apps/subject-portal",
    "packages/ui",
    "packages/gateway-rewrite",
    "packages/usdm-schemas"
]

[tool.uv.sources]
packages-cli = { workspace = true }
packages-security = { workspace = true }
packages-database = { workspace = true }
packages-deid = { workspace = true }
packages-storage = { workspace = true }
packages-hexagonal = { workspace = true }
packages-compliance = { workspace = true }
packages-testing = { workspace = true }
apps-ctms = { workspace = true }
apps-designer = { workspace = true }
apps-econsent = { workspace = true }
apps-eisf = { workspace = true }
apps-etmf = { workspace = true }
apps-execution = { workspace = true }
apps-gateway = { workspace = true }
apps-interop = { workspace = true }
apps-notifications = { workspace = true }
apps-org = { workspace = true }
apps-quality = { workspace = true }
apps-safety = { workspace = true }
apps-tickets = { workspace = true }

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "N",
    "RET",
    "S101",
    "SIM",
    "UP",
]
ignore = [
    "E501",   # line-length — handled by formatter
    "SIM117",  # nested with statements in test mocks
    "SIM102",  # nested if statements
    "N817",    # CamelCase acronym imports
]

[tool.ruff.lint.per-file-ignores]
# models.py is auto-generated by Alembic tooling; import order and length
# violations are expected and excluded from both CLI and per-file checks.
"apps/execution/database/models.py" = ["ALL"]
"apps/execution/biostat/models.py" = ["N815"]
"apps/execution/src/domain/sdtm/dataset_json_models.py" = ["N815"]
"tests/conftest.py" = ["E402"]
"tests/**" = ["S101"]
"**/tests/**" = ["S101"]
"**/test_*.py" = ["S101"]
"**/*_test.py" = ["S101"]
"scripts/**" = ["S101", "E402", "UP036"]

# ---------------------------------------------------------------------------
# SQLAlchemy boolean filter pattern — IMPORTANT for all contributors
# ---------------------------------------------------------------------------
# Never use `Column == True` or `Column == False` in SQLAlchemy .where().
# Python's `==` emits a Python bool comparison (E712), not SQL.
# Use the ORM-correct form instead:
#
#   WRONG:  Model.is_active == True        # triggers E712, wrong SQL
#   WRONG:  Model.is_active == False       # triggers E712, wrong SQL
#   RIGHT:  Model.is_active.is_(True)      # emits: col IS TRUE
#   RIGHT:  Model.is_active.is_(False)     # emits: col IS FALSE
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "--cov=apps --cov=packages --cov-fail-under=80 --dist=worksteal"
testpaths = [
    "tests",
    "apps",
    "packages",
    "scripts",
]
python_files = "test_*.py *_test.py *tests.py *suite.py"
asyncio_mode = "auto"

[tool.coverage.run]
source = [
    "apps",
    "packages",
]
concurrency = ["thread", "greenlet"]
# Omit empty scaffolded hexagonal architecture templates to keep functional business coverage accurate
omit = [
    "apps/*/adapter/**",
    "apps/*/adapters/**",
    "apps/*/domain/**",
    "apps/*/ports/**",
    "packages/hexagonal/**",
]

[tool.coverage.report]
fail_under = 80

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cadence-clinical"
version = "0.1.0"
description = "The Metadata-Driven Clinical Execution Platform"
authors = [
    { name = "Frederick de Ruiter", email = "fpderutier@gmail.com" },
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.139.2,<0.140.0",
    "uvicorn[standard]>=0.51.0,<0.52.0",
    "pydantic>=2.6.0",
    "httpx>=0.27.0",
    "neo4j>=5.18.0",
    "sqlalchemy>=2.0.28",
    "sqlmodel>=0.0.22",
    "asyncpg>=0.29.0",
    "python-jose[cryptography]>=3.3.0",
    "usdm>=0.65.0",
    "defusedxml>=0.7.1,<0.8.0",
    "jinja2>=3.1.6,<4.0.0",
    "python-multipart>=0.0.32",
    "PyMuPDF>=1.24.0",
    "weasyprint>=61.0",
    "python-docx>=1.1.0",
    "aioboto3>=13.0.0",
    "aiosmtplib>=3.0.1",
    "alembic>=1.13.0",
    "boto3>=1.34.0",
    "rapidfuzz>=3.14.5",
    "redis>=5.0.0",
    "pyyaml>=6.0.1",
    "docxtpl>=0.20.2",
    "docxcompose>=2.2.0",
    "sqlmodel>=0.0.39",
    "jsonschema>=4.20.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
]

[project.scripts]
cadence = "packages.cli.main:main"
deid-scan = "packages.deid.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.3.0",
    "aiosqlite>=0.22.1",
    "pytest-cov>=7.1.0",
    "pre-commit>=4.6.1",
    "detect-secrets>=1.5.0",
    "bandit>=1.9.4",
    "pip-audit>=2.10.1",
    "ecdsa>=0.19.2",
    "playwright>=1.40.0",
    "pytest-playwright>=0.4.0",
    "pytest-xdist>=3.5.0",
    "pytest-archon>=0.0.5",
    "mypy>=1.9.0",
]

[tool.hatch.build.targets.wheel]
packages = [
    "apps",
    "packages"
]
